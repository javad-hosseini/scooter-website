components:
  schemas:
    ArticleDetail:
      type: object
      description: برای صفحه جزئیات - شامل description کامل و اطلاعات نویسنده
      properties:
        title:
          type: string
          title: عنوان مقاله
          maxLength: 255
        slug:
          type: string
          title: اسلاگ
          pattern: ^[-\w]+$
          maxLength: 280
        description:
          type: string
          title: محتوا
        excerpt:
          type: string
          title: خلاصه
          description:
            خلاصه‌ای از مقاله که در کارت‌ها و متا دیسکریپشن نمایش داده
            می‌شود. اگر خالی باشد، از ۱۵۰ کاراکتر اول description استفاده می‌شود.
          maxLength: 300
        cover_image_url:
          type: string
          readOnly: true
        cover_alt_text:
          type: string
          title: متن جایگزین تصویر
          description: برای سئو و دسترسی‌پذیری
          maxLength: 200
        attachment:
          type: string
          format: uri
          nullable: true
          description: "فرمت‌های مجاز: png, jpg, webp, mp4, mp3, pdf — حداکثر ۲۵ مگابایت"
          pattern: (?:png|jpg|jpeg|webp|mp4|mp3|pdf)$
        attachment_type:
          type: string
          readOnly: true
        time_to_read:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
          title: زمان مطالعه (دقیقه)
          description: اگر خالی باشد، به‌طور خودکار از روی محتوا محاسبه می‌شود
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: زمان ایجاد
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: آخرین بروزرسانی
        published_at:
          type: string
          format: date-time
          nullable: true
          title: زمان انتشار
          description:
            اگر خالی باشد و is_published=True باشد، زمان ایجاد استفاده
            می‌شود
        author_name:
          type: string
          readOnly: true
        author_bio:
          type: string
          readOnly: true
          default: ""
        author_profile_image:
          type: string
          readOnly: true
        author_joined_date:
          type: string
          readOnly: true
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
          readOnly: true
        meta_description:
          type: string
          title: متا دیسکریپشن
          description: اگر خالی باشد، از excerpt استفاده می‌شود
          maxLength: 160
        meta_keywords:
          type: string
          title: کلمات کلیدی
          description: با کاما جدا کنید
          maxLength: 200
        canonical_url:
          type: string
          format: uri
          title: لینک کنونیکال
          description: اگر خالی باشد، لینک خود مقاله استفاده می‌شود
          maxLength: 200
        view_count:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: تعداد بازدید
        related_articles:
          type: string
          readOnly: true
        comments_count:
          type: string
          readOnly: true
        recent_comments:
          type: string
          readOnly: true
      required:
        - attachment_type
        - author_bio
        - author_joined_date
        - author_name
        - author_profile_image
        - comments_count
        - cover_image_url
        - created_at
        - description
        - recent_comments
        - related_articles
        - slug
        - tags
        - title
        - updated_at
    ArticleList:
      type: object
      description: برای صفحه لیست - سبک، بدون description کامل
      properties:
        title:
          type: string
          title: عنوان مقاله
          maxLength: 255
        slug:
          type: string
          title: اسلاگ
          pattern: ^[-\w]+$
          maxLength: 280
        excerpt:
          type: string
          title: خلاصه
          description:
            خلاصه‌ای از مقاله که در کارت‌ها و متا دیسکریپشن نمایش داده
            می‌شود. اگر خالی باشد، از ۱۵۰ کاراکتر اول description استفاده می‌شود.
          maxLength: 300
        cover_image_url:
          type: string
          readOnly: true
        cover_alt_text:
          type: string
          title: متن جایگزین تصویر
          description: برای سئو و دسترسی‌پذیری
          maxLength: 200
        time_to_read:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
          title: زمان مطالعه (دقیقه)
          description: اگر خالی باشد، به‌طور خودکار از روی محتوا محاسبه می‌شود
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: زمان ایجاد
        published_at:
          type: string
          format: date-time
          nullable: true
          title: زمان انتشار
          description:
            اگر خالی باشد و is_published=True باشد، زمان ایجاد استفاده
            می‌شود
        author_name:
