<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>مقالات | VOLTEX</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #020617;
        --surface: #0f172a;
        --accent: #06b6d4;
        --accent-2: #22d3ee;
        --danger: #ef4444;
        --text: #ffffff;
        --text-mid: rgba(255, 255, 255, 0.66);
        --text-low: rgba(255, 255, 255, 0.4);
        --border: rgba(255, 255, 255, 0.13);
        --glass: rgba(255, 255, 255, 0.045);
        --glass-strong: rgba(255, 255, 255, 0.09);
        --ease: cubic-bezier(0.4, 0, 0.2, 1);
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Vazirmatn", sans-serif;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: inherit;
        text-decoration: none;
      }

      .page-wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 2.5rem 1.25rem 4rem;
      }

      .page-head {
        margin-bottom: 1.8rem;
      }
      .page-head h1 {
        font-size: 1.6rem;
        font-weight: 800;
        margin: 0 0 0.4rem;
      }
      .page-head p {
        font-size: 0.86rem;
        color: var(--text-mid);
        margin: 0;
      }

      .search-box {
        position: relative;
        margin-bottom: 1.3rem;
      }
      .search-box i {
        position: absolute;
        right: 1rem;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-low);
        font-size: 1rem;
      }
      .search-box input {
        width: 100%;
        height: 52px;
        border-radius: 14px;
        border: 1px solid var(--border);
        background: var(--glass);
        color: var(--text);
        font-family: inherit;
        font-size: 0.9rem;
        padding: 0 3rem 0 1.2rem;
        outline: 0;
        transition: all 0.25s var(--ease);
      }
      .search-box input:focus {
        border-color: var(--accent);
        background: var(--glass-strong);
        box-shadow: 0 0 0 4px rgba(6, 182, 212, 0.16);
      }
      .search-clear {
        position: absolute;
        left: 0.8rem;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: 0;
        color: var(--text-low);
        cursor: pointer;
        font-size: 1rem;
        display: none;
        padding: 0.3rem;
      }
      .search-clear.show {
        display: block;
      }
      .search-clear:hover {
        color: var(--danger);
      }

      .tag-filters {
        display: flex;
        flex-wrap: wrap;
        gap: 0.55rem;
        margin-bottom: 2rem;
      }
      .tag-chip {
        font-size: 0.8rem;
        font-weight: 600;
        padding: 0.5rem 1.1rem;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--glass);
        color: var(--text-mid);
        cursor: pointer;
        transition: all 0.2s var(--ease);
        user-select: none;
      }
      .tag-chip:hover {
        border-color: rgba(6, 182, 212, 0.45);
        color: var(--text);
      }
      .tag-chip.active {
        border-color: var(--accent);
        background: rgba(6, 182, 212, 0.14);
        color: var(--accent-2);
        box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.1);
      }
      .tag-chip.all {
        font-weight: 700;
      }

      .articles-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1.4rem;
        min-height: 200px;
      }

      .article-card {
        border-radius: 20px;
        border: 1px solid var(--border);
        background: var(--glass);
        overflow: hidden;
        transition:
          transform 0.25s var(--ease),
          border-color 0.25s var(--ease),
          box-shadow 0.25s var(--ease);
        display: flex;
        flex-direction: column;
      }
      .article-card:hover {
        transform: translateY(-4px);
        border-color: rgba(6, 182, 212, 0.4);
        box-shadow: 0 20px 50px -25px rgba(6, 182, 212, 0.35);
      }
      .article-card img {
        width: 100%;
        height: 170px;
        object-fit: cover;
        display: block;
        background: var(--surface);
      }
      .card-body {
        padding: 1.1rem 1.2rem 1.3rem;
        display: flex;
        flex-direction: column;
        flex: 1;
      }
      .card-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        margin-bottom: 0.6rem;
      }
      .card-tags span {
        font-size: 0.68rem;
        font-weight: 700;
        color: var(--accent-2);
        background: rgba(6, 182, 212, 0.1);
        padding: 0.2rem 0.6rem;
        border-radius: 999px;
      }
      .card-title {
        font-size: 1rem;
        font-weight: 800;
        line-height: 1.6;
        margin: 0 0 0.7rem;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .card-meta {
        display: flex;
        align-items: center;
        gap: 0.9rem;
        font-size: 0.74rem;
        color: var(--text-low);
        margin-top: auto;
        padding-top: 0.7rem;
        border-top: 1px solid var(--border);
      }
      .card-meta span {
        display: flex;
        align-items: center;
        gap: 0.3rem;
      }

      .card-skeleton {
        border-radius: 20px;
        border: 1px solid var(--border);
        background: var(--glass);
        overflow: hidden;
        animation: pulse 1.4s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.5;
        }
        50% {
          opacity: 0.9;
        }
      }
      .card-skeleton .sk-img {
        width: 100%;
        height: 170px;
        background: var(--glass-strong);
      }
      .card-skeleton .sk-body {
        padding: 1.1rem 1.2rem;
      }
      .card-skeleton .sk-line {
        height: 12px;
        border-radius: 6px;
        background: var(--glass-strong);
        margin-bottom: 0.5rem;
      }

      .state-msg {
        display: none;
        text-align: center;
        padding: 3.5rem 1rem;
        grid-column: 1/-1;
      }
      .state-msg.show {
        display: block;
      }
      .state-msg i {
        font-size: 2.2rem;
        color: var(--text-low);
        margin-bottom: 1rem;
        display: block;
      }
      .state-msg p {
        color: var(--text-mid);
        font-size: 0.88rem;
        margin: 0;
      }

      .pagination-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        margin-top: 2.4rem;
      }
      .page-btn {
        min-width: 38px;
        height: 38px;
        padding: 0 0.6rem;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--glass);
        color: var(--text-mid);
        font-family: inherit;
        font-size: 0.82rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s var(--ease);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .page-btn:hover:not(:disabled) {
        border-color: rgba(6, 182, 212, 0.45);
        color: var(--text);
      }
      .page-btn.active {
        background: linear-gradient(120deg, var(--accent), #7c3aed);
        border-color: transparent;
        color: #fff;
      }
      .page-btn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .page-dots {
        color: var(--text-low);
        font-size: 0.82rem;
        padding: 0 0.2rem;
      }

      @media (max-width: 520px) {
        .articles-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-wrap">
      <div class="page-head">
        <h1>مقالات</h1>
        <p>آخرین مطالب و راهنماهای فروش و نگهداری اسکوتر</p>
      </div>

      <div class="search-box">
        <i class="bi bi-search"></i>
        <input type="text" id="searchInput" placeholder="جستجو در مقالات..." />
        <button
          type="button"
          class="search-clear"
          id="searchClear"
          aria-label="پاک کردن جستجو"
        >
          <i class="bi bi-x-circle-fill"></i>
        </button>
      </div>

      <div class="tag-filters" id="tagFilters">
        <span class="tag-chip all active" data-tag="">همه</span>
      </div>

      <div class="articles-grid" id="articlesGrid"></div>

      <div class="state-msg" id="emptyState">
        <i class="bi bi-inbox"></i>
        <p>مقاله‌ای با این مشخصات پیدا نشد</p>
      </div>

      <div class="state-msg" id="errorState">
        <i class="bi bi-exclamation-triangle"></i>
        <p id="errorMsg">خطا در دریافت مقالات</p>
      </div>

      <div class="pagination-row" id="paginationRow"></div>
    </div>

    <script>
      (function () {
        var grid = document.getElementById("articlesGrid");
        var emptyState = document.getElementById("emptyState");
        var errorState = document.getElementById("errorState");
        var errorMsg = document.getElementById("errorMsg");
        var paginationRow = document.getElementById("paginationRow");
        var searchInput = document.getElementById("searchInput");
        var searchClear = document.getElementById("searchClear");
        var tagFilters = document.getElementById("tagFilters");

        var state = { search: "", tag: "", page: 1 };
        var debounceTimer = null;
        var currentController = null;

        function formatDate(isoString) {
          try {
            var d = new Date(isoString);
            return new Intl.DateTimeFormat("fa-IR", {
              month: "short",
              day: "numeric",
            }).format(d);
          } catch (e) {
            return "";
          }
        }

        function skeletonCards(count) {
          var html = "";
          for (var i = 0; i < count; i++) {
            html +=
              '<div class="card-skeleton">' +
              '<div class="sk-img"></div>' +
              '<div class="sk-body">' +
              '<div class="sk-line" style="width:60%"></div>' +
              '<div class="sk-line" style="width:90%"></div>' +
              '<div class="sk-line" style="width:75%"></div>' +
              "</div>" +
              "</div>";
          }
          grid.innerHTML = html;
        }

        function escapeHtml(str) {
          var div = document.createElement("div");
          div.textContent = String(str == null ? "" : str);
          return div.innerHTML;
        }
        function escapeAttr(str) {
          return escapeHtml(str).replace(/"/g, "&quot;");
        }

        function renderCardThumbnail(a) {
          // اولویت ۱: cover_image_url (تصویر شاخص)
          if (a.cover_image_url) {
            return (
              '<img src="' +
              escapeAttr(a.cover_image_url) +
              '" alt="' +
              escapeAttr(a.title) +
              '" loading="lazy">'
            );
          }

          // اولویت ۲: attachment اگر تصویر باشد
          if (a.attachment_type === "image" && a.attachment) {
            // اگر attachment با /media/ شروع نشده، اضافه کن
            var imgSrc = a.attachment;
            if (!imgSrc.startsWith("/media/") && !imgSrc.startsWith("http")) {
              imgSrc = "/media/" + imgSrc;
            }
            return (
              '<img src="' +
              escapeAttr(imgSrc) +
              '" alt="' +
              escapeAttr(a.title) +
              '" loading="lazy">'
            );
          }

          // fallback برای فایل‌های غیرتصویر
          var icons = {
            video: "bi-play-circle",
            audio: "bi-music-note-beamed",
            pdf: "bi-file-earmark-pdf",
          };
          var icon = icons[a.attachment_type] || "bi-file-earmark";
          return (
            '<div style="height:170px;display:flex;align-items:center;justify-content:center;background:var(--surface);">' +
            '<i class="bi ' +
            icon +
            '" style="font-size:2.2rem;color:var(--text-low);"></i>' +
            "</div>"
          );
        }

        function renderCards(articles) {
          if (articles.length === 0) {
            grid.innerHTML = "";
            emptyState.classList.add("show");
            return;
          }
          emptyState.classList.remove("show");

          grid.innerHTML = articles
            .map(function (a) {
              var tagsHtml = (a.tags || [])
                .map(function (t) {
                  return "<span>" + escapeHtml(t.name) + "</span>";
                })
                .join("");

              return (
                '<a class="article-card" href="/articles/' +
                encodeURIComponent(a.slug) +
                '/">' +
                renderCardThumbnail(a) +
                '<div class="card-body">' +
                '<div class="card-tags">' +
                tagsHtml +
                "</div>" +
                '<h3 class="card-title">' +
                escapeHtml(a.title) +
                "</h3>" +
                '<div class="card-meta">' +
                '<span><i class="bi bi-person"></i>' +
                escapeHtml(a.author_name || "ناشناس") +
                "</span>" +
                '<span><i class="bi bi-clock"></i>' +
                a.time_to_read +
                " دقیقه</span>" +
                '<span><i class="bi bi-calendar3"></i>' +
                formatDate(a.created_at) +
                "</span>" +
                "</div>" +
                "</div>" +
                "</a>"
              );
            })
            .join("");
        }

        function renderPagination(meta) {
          var totalPages = Math.ceil(meta.count / meta.pageSize);
          paginationRow.innerHTML = "";
          if (totalPages <= 1) return;

          function makeBtn(label, page, opts) {
            opts = opts || {};
            var btn = document.createElement("button");
            btn.className = "page-btn" + (opts.active ? " active" : "");
            btn.textContent = label;
            btn.disabled = !!opts.disabled;
            if (!opts.disabled && !opts.active) {
              btn.addEventListener("click", function () {
                state.page = page;
                fetchArticles();
                window.scrollTo({ top: 0, behavior: "smooth" });
              });
            }
            return btn;
          }

          paginationRow.appendChild(
            makeBtn("«", state.page - 1, { disabled: state.page <= 1 }),
          );

          var start = Math.max(1, state.page - 2);
          var end = Math.min(totalPages, state.page + 2);

          if (start > 1) {
            paginationRow.appendChild(makeBtn("1", 1));
            if (start > 2) {
              var dots = document.createElement("span");
              dots.className = "page-dots";
              dots.textContent = "...";
              paginationRow.appendChild(dots);
            }
          }

          for (var p = start; p <= end; p++) {
            paginationRow.appendChild(
              makeBtn(String(p), p, { active: p === state.page }),
            );
          }

          if (end < totalPages) {
            if (end < totalPages - 1) {
              var dots2 = document.createElement("span");
              dots2.className = "page-dots";
              dots2.textContent = "...";
              paginationRow.appendChild(dots2);
            }
            paginationRow.appendChild(makeBtn(String(totalPages), totalPages));
          }

          paginationRow.appendChild(
            makeBtn("»", state.page + 1, {
              disabled: state.page >= totalPages,
            }),
          );
        }

        function fetchArticles() {
          errorState.classList.remove("show");
          emptyState.classList.remove("show");
          skeletonCards(6);
          paginationRow.innerHTML = "";

          if (currentController) currentController.abort();
          currentController = new AbortController();

          var params = new URLSearchParams();
          if (state.search) params.set("search", state.search);
          if (state.tag) params.set("tag", state.tag);
          params.set("page", state.page);

          fetch("/api/articles/?" + params.toString(), {
            method: "GET",
            headers: { Accept: "application/json" },
            signal: currentController.signal,
          })
            .then(function (res) {
              if (!res.ok) throw new Error("bad_status");
              return res.json();
            })
            .then(function (data) {
              renderCards(data.results || []);
              renderPagination({ count: data.count || 0, pageSize: 10 });
            })
            .catch(function (err) {
              if (err.name === "AbortError") return;
              grid.innerHTML = "";
              errorMsg.textContent =
                "خطا در دریافت مقالات - لطفا دوباره تلاش کنید";
              errorState.classList.add("show");
            });
        }

        function fetchTags() {
          fetch("/api/tags/", { headers: { Accept: "application/json" } })
            .then(function (res) {
              return res.ok ? res.json() : [];
            })
            .then(function (tags) {
              (tags || []).forEach(function (tag) {
                var chip = document.createElement("span");
                chip.className = "tag-chip";
                chip.textContent = tag.name;
                chip.dataset.tag = tag.slug;
                chip.addEventListener("click", function () {
                  selectTag(tag.slug, chip);
                });
                tagFilters.appendChild(chip);
              });
            })
            .catch(function () {
              /* fail سبک - فیلتر "همه" همچنان کار می‌کنه */
            });
        }

        function selectTag(slug, chipEl) {
          tagFilters.querySelectorAll(".tag-chip").forEach(function (c) {
            c.classList.remove("active");
          });
          chipEl.classList.add("active");
          state.tag = slug;
          state.page = 1;
          fetchArticles();
        }

        tagFilters
          .querySelector(".tag-chip.all")
          .addEventListener("click", function (e) {
            selectTag("", e.currentTarget);
          });

        searchInput.addEventListener("input", function () {
          searchClear.classList.toggle("show", searchInput.value.length > 0);
          clearTimeout(debounceTimer);
          debounceTimer = setTimeout(function () {
            state.search = searchInput.value.trim();
            state.page = 1;
            fetchArticles();
          }, 400);
        });

        searchClear.addEventListener("click", function () {
          searchInput.value = "";
          searchClear.classList.remove("show");
          state.search = "";
          state.page = 1;
          fetchArticles();
        });

        fetchTags();
        fetchArticles();
      })();
    </script>
  </body>
</html>
