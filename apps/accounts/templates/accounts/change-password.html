<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>تغییر رمز عبور | پنل مدیریت فروش اسکوتر Nex Go</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

<style>
:root{
  --bg:#020617;
  --surface:#0F172A;
  --surface-2:#111B30;
  --accent:#06B6D4;
  --accent-2:#22D3EE;
  --success:#22C55E;
  --danger:#EF4444;
  --warning:#F59E0B;
  --text:#FFFFFF;
  --text-mid: rgba(255,255,255,.66);
  --text-low: rgba(255,255,255,.40);
  --glass: rgba(255,255,255,.045);
  --glass-strong: rgba(255,255,255,.09);
  --border: rgba(255,255,255,.13);
  --ease: cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  font-family:'Vazirmatn', sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
a{ color:inherit; }
::selection{ background:rgba(6,182,212,.35); }

.auth-page{ position:relative; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2.5rem 1rem; perspective:1400px; }
.bg-fx{ position:fixed; inset:0; z-index:0; overflow:hidden; background:var(--bg); }
.grid-overlay{
  position:absolute; inset:-2px;
  background-image:
    linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
  background-size:46px 46px;
  mask-image:radial-gradient(ellipse 80% 70% at 50% 45%, #000 35%, transparent 85%);
  opacity:.6;
}
.blob{ position:absolute; border-radius:50%; filter:blur(80px); will-change:transform; }
.blob-1{ width:560px; height:560px; top:-180px; right:-160px; background:radial-gradient(circle, rgba(6,182,212,.32), transparent 70%); animation:drift1 22s ease-in-out infinite; }
.blob-2{ width:480px; height:480px; bottom:-200px; left:-140px; background:radial-gradient(circle, rgba(139,92,246,.26), transparent 70%); animation:drift2 26s ease-in-out infinite; }
.blob-3{ width:380px; height:380px; top:40%; left:50%; background:radial-gradient(circle, rgba(34,211,238,.16), transparent 70%); animation:drift3 30s ease-in-out infinite; }
@keyframes drift1{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(-60px,60px) scale(1.12); } }
@keyframes drift2{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(50px,-40px) scale(1.08); } }
@keyframes drift3{ 0%,100%{ transform:translate(-50%,-50%) scale(1); } 50%{ transform:translate(-46%,-54%) scale(1.18); } }
#particleCanvas{ position:absolute; inset:0; width:100%; height:100%; }
.shape{
  position:absolute; border-radius:28px;
  background:linear-gradient(150deg, rgba(255,255,255,.08), rgba(255,255,255,.015));
  border:1px solid rgba(255,255,255,.10);
  backdrop-filter:blur(6px);
  box-shadow:0 20px 60px -20px rgba(0,0,0,.6);
  will-change:transform;
}
.shape-a{ width:96px; height:96px; top:10%; left:9%; border-radius:50%; animation:floatA 9s ease-in-out infinite; }
.shape-b{ width:64px; height:64px; bottom:14%; right:8%; transform:rotate(20deg); animation:floatB 11s ease-in-out infinite; }
.shape-c{ width:46px; height:46px; top:18%; right:14%; border-radius:14px; transform:rotate(-12deg); animation:floatC 8s ease-in-out infinite; }
.shape-d{ width:130px; height:130px; bottom:8%; left:12%; border-radius:38% 62% 60% 40%/40% 45% 55% 60%; animation:floatD 13s ease-in-out infinite; }
@keyframes floatA{ 0%,100%{ transform:translateY(0) rotate(0deg);} 50%{ transform:translateY(-26px) rotate(8deg);} }
@keyframes floatB{ 0%,100%{ transform:translateY(0) rotate(20deg);} 50%{ transform:translateY(22px) rotate(34deg);} }
@keyframes floatC{ 0%,100%{ transform:translateY(0) rotate(-12deg);} 50%{ transform:translateY(-16px) rotate(2deg);} }
@keyframes floatD{ 0%,100%{ transform:translateY(0) rotate(0deg);} 50%{ transform:translateY(18px) rotate(-10deg);} }
.vignette{ position:absolute; inset:0; background:radial-gradient(ellipse 70% 60% at 50% 50%, transparent 40%, rgba(2,6,23,.75) 100%); }
.noise-veil{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(2,6,23,0) 0%, rgba(2,6,23,.5) 100%); }

.auth-card{
  position:relative; z-index:10;
  width:100%; max-width:460px;
  padding:2.5rem 2.3rem 2rem;
  border-radius:28px;
  background:linear-gradient(165deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
  border:1px solid var(--border);
  backdrop-filter:blur(22px) saturate(140%);
  box-shadow:
    0 30px 80px -25px rgba(0,0,0,.65),
    0 0 0 1px rgba(255,255,255,.02) inset,
    0 0 60px -20px rgba(6,182,212,.18);
  opacity:0; transform:translateY(34px) scale(.96);
  animation:cardIn .85s var(--ease) .15s forwards, floatCard 7s ease-in-out 1.1s infinite;
  transform-style:preserve-3d;
}
@keyframes cardIn{ to{ opacity:1; transform:translateY(0) scale(1); } }
@keyframes floatCard{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-9px); } }
.auth-card::before{
  content:''; position:absolute; inset:-1px; border-radius:29px; padding:1px;
  background:linear-gradient(135deg, rgba(6,182,212,.55), rgba(255,255,255,.04) 30%, rgba(139,92,246,.35) 70%, rgba(6,182,212,.4));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude;
  opacity:.55; pointer-events:none;
}

.brand-area{ text-align:center; margin-bottom:1.5rem; opacity:0; animation:fadeUp .7s var(--ease) .3s forwards; }
.brand-mark{
  width:58px; height:58px; margin:0 auto .9rem; border-radius:18px;
  background:linear-gradient(135deg, var(--accent), #7C3AED);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 12px 30px -8px rgba(6,182,212,.55);
  position:relative;
  animation:markPulse 3.4s ease-in-out infinite;
}
.brand-mark svg{ width:28px; height:28px; }
.brand-mark::after{
  content:''; position:absolute; inset:-7px; border-radius:22px;
  border:1px solid rgba(6,182,212,.4); opacity:0; animation:markRing 3.4s ease-out infinite;
}
@keyframes markPulse{ 0%,100%{ box-shadow:0 12px 30px -8px rgba(6,182,212,.55);} 50%{ box-shadow:0 12px 38px -6px rgba(6,182,212,.85);} }
@keyframes markRing{ 0%{ opacity:.7; transform:scale(.9);} 100%{ opacity:0; transform:scale(1.25);} }
.brand-area .word{ font-size:.76rem; letter-spacing:.22em; color:var(--accent-2); font-weight:700; margin-bottom:.3rem; }
.brand-area h1{ font-size:1.26rem; font-weight:800; margin:0 0 .4rem; line-height:1.5; }
.brand-area p{ font-size:.83rem; color:var(--text-mid); margin:0; }
@keyframes fadeUp{ from{ opacity:0; transform:translateY(14px);} to{ opacity:1; transform:translateY(0);} }

.field{ position:relative; margin-bottom:1.05rem; opacity:0; animation:fadeUp .65s var(--ease) forwards; }
.field:nth-of-type(1){ animation-delay:.38s; }
.field:nth-of-type(2){ animation-delay:.48s; }
.field:nth-of-type(3){ animation-delay:.58s; }

.field .control{
  position:relative; display:flex; align-items:center;
  border-radius:14px; border:1px solid var(--border);
  background:var(--glass);
  transition: border-color .3s var(--ease), box-shadow .3s var(--ease), transform .2s var(--ease), background .3s var(--ease);
}
.field .control:hover{ border-color:rgba(6,182,212,.45); transform:translateY(-2px); background:var(--glass-strong); }
.field .control:focus-within{
  border-color:var(--accent);
  box-shadow:0 0 0 4px rgba(6,182,212,.16), 0 0 24px -6px rgba(6,182,212,.55);
  background:var(--glass-strong);
}
.field.is-invalid .control{ border-color:var(--danger); box-shadow:0 0 0 4px rgba(239,68,68,.14); animation:shake .45s var(--ease); }
.field.is-valid .control{ border-color:var(--success); box-shadow:0 0 0 4px rgba(34,197,94,.12); }
@keyframes shake{
  10%,90%{ transform:translateX(-1px); }
  20%,80%{ transform:translateX(2px); }
  30%,50%,70%{ transform:translateX(-4px); }
  40%,60%{ transform:translateX(4px); }
}
.field .ic{
  flex-shrink:0; width:50px; height:52px; display:flex; align-items:center; justify-content:center;
  color:var(--text-low); font-size:1.02rem; transition:color .3s var(--ease);
}
.field .control:focus-within .ic{ color:var(--accent-2); }
.field.is-invalid .ic{ color:var(--danger); }
.field.is-valid .ic{ color:var(--success); }
.field input{
  flex:1; min-width:0; height:52px; padding:1.05rem .25rem .25rem 0;
  background:transparent; border:0; outline:0; color:var(--text);
  font-family:inherit; font-size:.9rem;
}
.field input::placeholder{ color:transparent; }
.field label{
  position:absolute; right:50px; top:50%; transform:translateY(-50%);
  font-size:.84rem; color:var(--text-low); pointer-events:none;
  transition:all .25s var(--ease); background:transparent; padding:0 .2rem;
}
.field input:focus + label,
.field input:not(:placeholder-shown) + label{
  top:.2rem; font-size:.66rem; transform:translateY(0); color:var(--accent-2); font-weight:600;
}
.field.is-invalid input:not(:placeholder-shown) + label{ color:var(--danger); }
.field.is-valid input:not(:placeholder-shown) + label{ color:var(--success); }
.toggle-pass{
  flex-shrink:0; width:46px; height:52px; display:flex; align-items:center; justify-content:center;
  background:transparent; border:0; color:var(--text-low); font-size:1rem; transition:color .2s var(--ease);
}
.toggle-pass:hover{ color:var(--accent-2); }
.field-msg{ font-size:.71rem; color:var(--danger); margin:.32rem .3rem 0; min-height:1rem; opacity:0; transition:opacity .25s var(--ease); }
.field.is-invalid .field-msg{ opacity:1; }

/* password strength meter (روی فیلد رمز جدید) */
.strength-wrap{ margin:.5rem .3rem 0; opacity:0; height:0; overflow:hidden; transition:opacity .3s var(--ease), height .3s var(--ease); }
.strength-wrap.show{ opacity:1; height:24px; }
.strength-bars{ display:flex; gap:4px; margin-bottom:.3rem; }
.strength-bars i{ flex:1; height:4px; border-radius:4px; background:var(--border); transition:background .3s var(--ease); }
.strength-label{ font-size:.68rem; color:var(--text-low); }

.btn-login{
  position:relative; width:100%; height:54px; border:0; border-radius:14px;
  background:linear-gradient(120deg, var(--accent) 0%, #0891B2 45%, #7C3AED 100%);
  background-size:200% 200%;
  color:#fff; font-family:inherit; font-size:.95rem; font-weight:700;
  display:flex; align-items:center; justify-content:center; gap:.55rem;
  overflow:hidden; cursor:pointer;
  box-shadow:0 16px 36px -12px rgba(6,182,212,.55);
  transition: transform .25s var(--ease), box-shadow .25s var(--ease), background-position .6s var(--ease);
  opacity:0; animation:fadeUp .65s var(--ease) .72s forwards;
  margin-top:.4rem;
}
.btn-login:hover{ transform:translateY(-3px); box-shadow:0 22px 46px -10px rgba(6,182,212,.7); background-position:100% 50%; }
.btn-login:active{ transform:translateY(-1px) scale(.99); }
.btn-login:disabled{ cursor:not-allowed; opacity:.85; transform:none; }
.btn-login .ripple{
  position:absolute; border-radius:50%; background:rgba(255,255,255,.55);
  transform:scale(0); animation:rippleAnim .65s var(--ease) forwards; pointer-events:none;
}
@keyframes rippleAnim{ to{ transform:scale(2.6); opacity:0; } }
.spinner{
  width:18px; height:18px; border-radius:50%; border:2.5px solid rgba(255,255,255,.35);
  border-top-color:#fff; animation:spin .7s linear infinite; display:none;
}
.btn-login.loading .spinner{ display:inline-block; }
.btn-login.loading .btn-label{ display:none; }
@keyframes spin{ to{ transform:rotate(360deg); } }
.btn-login.success{ background:linear-gradient(120deg, var(--success), #16A34A); box-shadow:0 16px 36px -12px rgba(34,197,94,.55); }

.auth-foot{
  text-align:center; margin-top:1.5rem; padding-top:1.2rem; border-top:1px solid rgba(255,255,255,.08);
  opacity:0; animation:fadeUp .65s var(--ease) .82s forwards;
}
.auth-foot .login-line{ font-size:.83rem; color:var(--text-mid); margin-bottom:.9rem; }
.auth-foot .login-line a{ color:var(--accent-2); font-weight:700; position:relative; margin-right:.25rem; }
.auth-foot .login-line a::after{ content:''; position:absolute; right:0; left:0; bottom:-2px; height:1px; background:var(--accent-2); transform:scaleX(0); transform-origin:right; transition:transform .25s var(--ease); }
.auth-foot .login-line a:hover::after{ transform:scaleX(1); }

.foot-meta{ display:flex; align-items:center; justify-content:space-between; }
.support-link{ display:flex; align-items:center; gap:.4rem; font-size:.77rem; color:var(--text-mid); }
.support-link:hover{ color:var(--accent-2); }
.support-link svg{ width:14px; height:14px; }
.version-tag{ font-size:.7rem; color:var(--text-low); direction:ltr; font-variant-numeric:tabular-nums; }

.mini-toast{
  position:fixed; bottom:1.4rem; right:50%; transform:translateX(50%) translateY(20px);
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:.85rem 1.3rem; display:flex; align-items:center; gap:.6rem;
  box-shadow:0 20px 50px -20px rgba(0,0,0,.7); font-size:.84rem; font-weight:600;
  opacity:0; pointer-events:none; transition:all .4s var(--ease); z-index:200;
}
.mini-toast.show{ opacity:1; transform:translateX(50%) translateY(0); }
.mini-toast svg{ width:17px; height:17px; color:var(--success); flex-shrink:0; }
.mini-toast.error svg{ color:var(--danger); }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
}
@media (max-width:520px){
  .auth-card{ padding:2rem 1.4rem 1.6rem; border-radius:22px; }
  .shape-a,.shape-b,.shape-c,.shape-d{ opacity:.5; }
}
</style>
</head>
<body>

<div class="auth-page">

  <div class="bg-fx" id="bgFx">
    <div class="grid-overlay"></div>
    <div class="blob blob-1" data-depth="18"></div>
    <div class="blob blob-2" data-depth="26"></div>
    <div class="blob blob-3" data-depth="12"></div>
    <canvas id="particleCanvas"></canvas>
    <div class="shape shape-a" data-depth="40"></div>
    <div class="shape shape-b" data-depth="55"></div>
    <div class="shape shape-c" data-depth="30"></div>
    <div class="shape shape-d" data-depth="48"></div>
    <div class="vignette"></div>
    <div class="noise-veil"></div>
  </div>

  <div class="auth-card" id="authCard">

    <div class="brand-area">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg>
      </div>
      <div class="word">V O L T E X</div>
      <h1>تغییر رمز عبور</h1>
      <p>برای امنیت بیشتر، رمز عبور فعلی خود را تایید کنید</p>
    </div>

    <form id="changePasswordForm" novalidate>

      <div class="field" id="oldPassField">
        <div class="control">
          <span class="ic"><i class="bi bi-shield-lock"></i></span>
          <input type="password" id="oldPassword" placeholder=" " autocomplete="current-password">
          <label for="oldPassword">رمز عبور فعلی</label>
          <button type="button" class="toggle-pass" id="toggleOld" aria-label="نمایش رمز عبور"><i class="bi bi-eye"></i></button>
        </div>
        <p class="field-msg">لطفا رمز عبور فعلی خود را وارد کنید</p>
      </div>

      <div class="field" id="newPassField">
        <div class="control">
          <span class="ic"><i class="bi bi-lock"></i></span>
          <input type="password" id="newPassword1" placeholder=" " autocomplete="new-password">
          <label for="newPassword1">رمز عبور جدید</label>
          <button type="button" class="toggle-pass" id="toggleNew1" aria-label="نمایش رمز عبور"><i class="bi bi-eye"></i></button>
        </div>
        <div class="strength-wrap" id="strengthWrap">
          <div class="strength-bars">
            <i id="bar1"></i><i id="bar2"></i><i id="bar3"></i><i id="bar4"></i>
          </div>
          <span class="strength-label" id="strengthLabel">رمز عبور ضعیف</span>
        </div>
        <p class="field-msg">رمز عبور باید حداقل ۸ کاراکتر باشد</p>
      </div>

      <div class="field" id="newPassConfirmField">
        <div class="control">
          <span class="ic"><i class="bi bi-shield-check"></i></span>
          <input type="password" id="newPassword2" placeholder=" " autocomplete="new-password">
          <label for="newPassword2">تکرار رمز عبور جدید</label>
          <button type="button" class="toggle-pass" id="toggleNew2" aria-label="نمایش رمز عبور"><i class="bi bi-eye"></i></button>
        </div>
        <p class="field-msg">رمز عبور و تکرار آن یکسان نیستند</p>
      </div>

      <button type="submit" class="btn-login" id="changePassBtn">
        <span class="spinner"></span>
        <span class="btn-label" id="btnLabel">
          <i class="bi bi-arrow-repeat" style="margin-left:.4rem;"></i>تغییر رمز عبور
        </span>
      </button>
    </form>

    <div class="auth-foot">
      <p class="login-line">پشیمون شدید؟<a href="voltex-dashboard.html">بازگشت به داشبورد</a></p>
      <div class="foot-meta">
        <a href="#" class="support-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v12H7l-3 3V4Z"/></svg>
          پشتیبانی فنی
        </a>
        <span class="version-tag">v2.4.0</span>
      </div>
    </div>

  </div>

</div>

<div class="mini-toast" id="miniToast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg>
  <span id="toastMsg">رمز عبور با موفقیت تغییر کرد</span>
</div>

<script>
(function(){

  /* ============ Lightweight particle field ============ */
  var canvas = document.getElementById('particleCanvas');
  var ctx = canvas.getContext('2d');
  var particles = [];
  var W, H;
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize(){ W = canvas.width = canvas.offsetWidth; H = canvas.height = canvas.offsetHeight; }

  function initParticles(){
    var count = window.innerWidth < 600 ? 26 : 48;
    particles = [];
    for(var i=0;i<count;i++){
      particles.push({
        x: Math.random()*W, y: Math.random()*H,
        r: Math.random()*1.8 + .6,
        vx: (Math.random()-.5)*.18, vy: (Math.random()-.5)*.18,
        a: Math.random()*.5 + .25, pulse: Math.random()*Math.PI*2
      });
    }
  }

  function drawParticles(){
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<particles.length;i++){
      var p = particles[i];
      p.x += p.vx; p.y += p.vy; p.pulse += 0.02;
      if(p.x < -10) p.x = W+10; if(p.x > W+10) p.x = -10;
      if(p.y < -10) p.y = H+10; if(p.y > H+10) p.y = -10;
      var alpha = p.a * (0.6 + 0.4*Math.sin(p.pulse));
      ctx.beginPath();
      ctx.fillStyle = 'rgba(103,232,249,' + alpha + ')';
      ctx.shadowColor = 'rgba(6,182,212,0.9)';
      ctx.shadowBlur = 6;
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fill();
    }
    if(!reduceMotion) requestAnimationFrame(drawParticles);
  }

  window.addEventListener('resize', function(){ resize(); initParticles(); });
  resize(); initParticles(); drawParticles();

  /* ============ Parallax depth ============ */
  if(!reduceMotion && window.matchMedia('(pointer:fine)').matches){
    var depthEls = document.querySelectorAll('[data-depth]');
    var card = document.getElementById('authCard');
    window.addEventListener('mousemove', function(e){
      var mx = (e.clientX / window.innerWidth) - 0.5;
      var my = (e.clientY / window.innerHeight) - 0.5;
      depthEls.forEach(function(el){
        var depth = parseFloat(el.getAttribute('data-depth'));
        el.style.transform = (el.style.transform || '').split(' translate3d')[0];
        el.style.transform += ' translate3d(' + (mx*depth) + 'px,' + (my*depth) + 'px,0)';
      });
      card.style.transform = 'rotateY(' + (mx*4) + 'deg) rotateX(' + (-my*4) + 'deg)';
    });
    window.addEventListener('mouseleave', function(){ card.style.transform = 'rotateY(0deg) rotateX(0deg)'; });
  }

  /* ============ Password visibility ============ */
  function wirePassToggle(btnId, inputId){
    var btn = document.getElementById(btnId);
    var input = document.getElementById(inputId);
    btn.addEventListener('click', function(){
      var isPass = input.type === 'password';
      input.type = isPass ? 'text' : 'password';
      btn.innerHTML = isPass ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
    });
  }
  wirePassToggle('toggleOld','oldPassword');
  wirePassToggle('toggleNew1','newPassword1');
  wirePassToggle('toggleNew2','newPassword2');

  /* ============ Ripple effect ============ */
  var changePassBtn = document.getElementById('changePassBtn');
  changePassBtn.addEventListener('click', function(e){
    var rect = changePassBtn.getBoundingClientRect();
    var size = Math.max(rect.width, rect.height);
    var ripple = document.createElement('span');
    ripple.className = 'ripple';
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
    ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
    changePassBtn.appendChild(ripple);
    setTimeout(function(){ ripple.remove(); }, 650);
  });

  /* ============ Password strength meter ============ */
  var newPass1Input = document.getElementById('newPassword1');
  var strengthWrap = document.getElementById('strengthWrap');
  var bars = [document.getElementById('bar1'), document.getElementById('bar2'), document.getElementById('bar3'), document.getElementById('bar4')];
  var strengthLabel = document.getElementById('strengthLabel');
  var strengthColors = ['var(--danger)','var(--danger)','var(--warning)','var(--success)'];
  var strengthTexts = ['رمز عبور ضعیف','رمز عبور ضعیف','رمز عبور متوسط','رمز عبور قوی'];

  function scorePassword(val){
    var score = 0;
    if(val.length >= 8) score++;
    if(val.length >= 12) score++;
    if(/[0-9]/.test(val) && /[a-zA-Z]/.test(val)) score++;
    if(/[^a-zA-Z0-9]/.test(val)) score++;
    return Math.min(score, 4);
  }

  newPass1Input.addEventListener('input', function(){
    var val = newPass1Input.value;
    if(val.length === 0){ strengthWrap.classList.remove('show'); return; }
    strengthWrap.classList.add('show');
    var score = scorePassword(val);
    var idx = Math.max(score - 1, 0);
    bars.forEach(function(bar, i){ bar.style.background = i < score ? strengthColors[idx] : 'var(--border)'; });
    strengthLabel.textContent = strengthTexts[idx];
    strengthLabel.style.color = strengthColors[idx];
  });

  /* ============ Field validation ============ */
  var oldPassField = document.getElementById('oldPassField');
  var newPassField = document.getElementById('newPassField');
  var newPassConfirmField = document.getElementById('newPassConfirmField');

  var oldPasswordInput = document.getElementById('oldPassword');
  var newPassword2Input = document.getElementById('newPassword2');

  function markValid(field, ok){
    field.classList.toggle('is-invalid', !ok);
    field.classList.toggle('is-valid', ok);
    return ok;
  }

  function validateOld(){ return markValid(oldPassField, oldPasswordInput.value.length > 0); }
  // حداقل ۸ کاراکتر چون validate_password جنگو پیش‌فرض همین حداقل رو داره؛ اگه بک‌اند حداقل دیگه‌ای خواست همین‌جا تنظیم کن
  function validateNew1(){ return markValid(newPassField, newPass1Input.value.length >= 8); }
  function validateNew2(){ return markValid(newPassConfirmField, newPassword2Input.value.length > 0 && newPassword2Input.value === newPass1Input.value); }
  function validateNotSameAsOld(){
    if(newPass1Input.value.length > 0 && oldPasswordInput.value.length > 0 && newPass1Input.value === oldPasswordInput.value){
      markValid(newPassField, false);
      newPassField.querySelector('.field-msg').textContent = 'رمز عبور جدید نباید با رمز عبور فعلی یکسان باشد';
      return false;
    }
    return true;
  }

  oldPasswordInput.addEventListener('blur', function(){ if(oldPasswordInput.value.length) validateOld(); });
  newPass1Input.addEventListener('blur', function(){ if(newPass1Input.value.length) validateNew1() && validateNotSameAsOld(); });
  newPassword2Input.addEventListener('blur', function(){ if(newPassword2Input.value.length) validateNew2(); });

  [oldPasswordInput, newPass1Input, newPassword2Input].forEach(function(inp, idx){
    inp.addEventListener('input', function(){
      [oldPassField, newPassField, newPassConfirmField][idx].classList.remove('is-invalid');
    });
  });

  /* ============ Submit flow ============ */
  var form = document.getElementById('changePasswordForm');
  var toast = document.getElementById('miniToast');
  var toastMsg = document.getElementById('toastMsg');

  function showToast(msg, isError){
    toastMsg.textContent = msg;
    toast.classList.toggle('error', !!isError);
    toast.classList.add('show');
    setTimeout(function(){ toast.classList.remove('show'); }, 3200);
  }

  function getCookie(name){
    var match = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
    return match ? match.pop() : '';
  }

  // map کلیدهای احتمالی بک‌اند به فیلدهای فرم — وقتی endpoint واقعی رو ساختیم
  // اگه اسم فیلدهای سریالایزر فرق داشت (مثلا old_password به جای oldPassword) همینجا اصلاح کن
  var fieldMap = {
    old_password: oldPassField,
    new_password1: newPassField,
    new_password2: newPassConfirmField
  };

  function renderServerErrors(errors){
    var firstInvalid = null;
    Object.keys(errors).forEach(function(key){
      var joined = Array.isArray(errors[key]) ? errors[key].join(' — ') : String(errors[key]);
      if(key === 'non_field_errors'){
        showToast(joined, true);
        return;
      }
      var wrap = fieldMap[key];
      if(!wrap){ showToast(joined, true); return; }
      wrap.classList.add('is-invalid');
      wrap.classList.remove('is-valid');
      wrap.querySelector('.field-msg').textContent = joined;
      if(!firstInvalid) firstInvalid = wrap.querySelector('input');
    });
    if(firstInvalid) firstInvalid.focus();
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();

    var validOld = validateOld();
    var validNew1 = validateNew1();
    var validNew2 = validateNew2();
    var notSame = validateNotSameAsOld();

    if(!(validOld && validNew1 && validNew2 && notSame)){
      var firstInvalid = document.querySelector('.field.is-invalid input');
      if(firstInvalid) firstInvalid.focus();
      return;
    }

    changePassBtn.classList.add('loading');
    changePassBtn.disabled = true;

fetch('/accounts/api/change-password/', {
  method: 'POST',
  headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
  body: JSON.stringify({
    old_password: oldPasswordInput.value,
    new_password1: newPass1Input.value,
    new_password2: newPassword2Input.value
  })
})

    // --- Stub موقت تا بک‌اند وصل بشه ---
    setTimeout(function(){
      changePassBtn.classList.remove('loading');
      changePassBtn.classList.add('success');
      document.getElementById('btnLabel').innerHTML = '<i class="bi bi-check-circle-fill" style="margin-left:.4rem;"></i>تغییر یافت';
      document.getElementById('btnLabel').style.display = 'flex';
      document.getElementById('btnLabel').style.alignItems = 'center';
      document.getElementById('btnLabel').style.justifyContent = 'center';
      showToast('این یک شبیه‌سازی است — بک‌اند هنوز وصل نشده');

      setTimeout(function(){
        changePassBtn.classList.remove('success');
        changePassBtn.disabled = false;
        document.getElementById('btnLabel').innerHTML = '<i class="bi bi-arrow-repeat" style="margin-left:.4rem;"></i>تغییر رمز عبور';
      }, 2600);
    }, 1200);
  });

})();
</script>

</body>
</html>
