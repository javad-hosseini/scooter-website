    <!-- ============================================================

     ============================================================ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap"

    <!-- ============================================================
     STYLES — تمام استایل‌های فایل index.html رو اینجا کپی کن
     (از <style> تا </style> فایل اصلی)
     ============================================================ -->
    <style>
      /* ══════════════════════════════════════════
   DESIGN TOKENS — refined dark "instrument cluster" system
   Display / Body / UI: Vazirmatn (Persian) with Space Grotesk / Inter fallback
   Mono: JetBrains Mono (dashboard numerals — the signature)
══════════════════════════════════════════ */
      :root {
        --black: #050507;
        --deep: #08080d;
        --surface: #0c0c13;
        --card: #101018;
        --card-hover: #14141e;
        --border: rgba(255, 255, 255, 0.06);
        --border-lit: rgba(125, 211, 252, 0.22);
        --white: #f6f6f8;
        --dim: rgba(246, 246, 248, 0.58);
        --muted: rgba(246, 246, 248, 0.32);
        --neon: #4fd8ff;
        --neon2: #8b7bff;
        --neon3: #ff6cc4;
        --gold: #e9c97f;
        --accent: #4fd8ff;
        --glow: rgba(79, 216, 255, 0.14);
        --glow2: rgba(139, 123, 255, 0.14);
        --font-display: "Vazirmatn", "Space Grotesk", sans-serif;
        --font-ui: "Vazirmatn", "Inter", sans-serif;
        --font-body: "Vazirmatn", "Inter", sans-serif;
        --font-mono: "JetBrains Mono", "Vazirmatn", monospace;
        --ease-luxury: cubic-bezier(0.22, 1, 0.36, 1);
        --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
        --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
        --transition-duration: 900ms;
        --nav-h: 64px;
        --r-sm: 10px;
        --r-md: 14px;
        --r-lg: 20px;
        --shadow-card:
          0 1px 0 rgba(255, 255, 255, 0.03) inset,
          0 20px 50px -20px rgba(0, 0, 0, 0.7);
        --shadow-lift:
          0 30px 70px -24px rgba(0, 0, 0, 0.75),
          0 0 0 1px rgba(255, 255, 255, 0.04) inset;
      }
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        font-size: 16px;
        overflow: hidden;
      }
      body {
        background: var(--black);
        color: var(--white);
        font-family: var(--font-body);
        font-weight: 300;
        overflow: hidden;
        height: 100dvh;
        width: 100vw;
        overscroll-behavior: none;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      ::selection {
        background: var(--neon);
        color: var(--black);
      }
      :focus-visible {
        outline: 1.5px solid var(--neon);
        outline-offset: 3px;
        border-radius: 4px;
      }

      /* Numeric / unit displays stay LTR so digits + units (km/h, kg, €) don't get bidi-reordered */
      .hero-mini-stat-val,
      .cat-img-metric-val,
      .cat-spec-val-d,
      .pc-spec-val-m,
      .pc-spec-val-d,
      .pc-price-m,
      .pc-price-d,
      .promise-big-d,
      .ps-badge-m,
      .testi-count-badge,
      #scroll-progress,
      .stat-value {
        direction: ltr;
        unicode-bidi: isolate;
      }

      /* ── LOADER ── */
      #loader {
        position: fixed;
        inset: 0;
        background: var(--black);
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 22px;
        transition:
          opacity 1.1s var(--ease-luxury),
          visibility 1.1s;
      }
      #loader.done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .loader-logo {
        font-family: "Space Grotesk", sans-serif;
        font-weight: 700;
        font-size: clamp(1.8rem, 7vw, 2.6rem);
        letter-spacing: 0.28em;
        color: var(--white);
        opacity: 0.92;
        animation: loaderPulse 1.8s ease-in-out infinite;
        direction: ltr;
      }
      .loader-bar {
        width: 140px;
        height: 1.5px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 1px;
        overflow: hidden;
      }
      .loader-fill {
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, var(--neon), var(--neon2));
        border-radius: 1px;
        animation: loaderFill 2s var(--ease-luxury) forwards;
      }
      @keyframes loaderPulse {
        0%,
        100% {
          opacity: 0.92;
        }
        50% {
          opacity: 0.45;
        }
      }
      @keyframes loaderFill {
        to {
          width: 100%;
        }
      }

      /* ── NAV ── */
      nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1000;
        height: var(--nav-h);
        padding: 0 22px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(5, 5, 7, 0.78);
        backdrop-filter: blur(22px) saturate(140%);
        -webkit-backdrop-filter: blur(22px) saturate(140%);
        border-bottom: 1px solid var(--border);
      }
      .nav-logo {
        font-family: "Space Grotesk", sans-serif;
        font-weight: 700;
        font-size: 1.25rem;
        letter-spacing: 0.22em;
        color: var(--white);
        flex-shrink: 0;
        direction: ltr;
      }
      .nav-links {
        display: none;
      }
      .nav-menu-btn {
        width: 40px;
        height: 40px;
        background: transparent;
        border: 1px solid var(--border);
        border-radius: var(--r-sm);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
        cursor: pointer;
        padding: 0;
        transition:
          border-color 0.35s var(--ease-smooth),
          background 0.35s var(--ease-smooth);
        flex-shrink: 0;
      }
      .nav-menu-btn:hover {
        border-color: var(--border-lit);
        background: rgba(255, 255, 255, 0.02);
      }
      .nav-menu-btn span {
        display: block;
        width: 16px;
        height: 1.5px;
        background: var(--dim);
        transition: all 0.35s var(--ease-luxury);
      }
      .nav-menu-btn.open span:nth-child(1) {
        transform: rotate(45deg) translate(4px, 4px);
      }
      .nav-menu-btn.open span:nth-child(2) {
        opacity: 0;
      }
      .nav-menu-btn.open span:nth-child(3) {
        transform: rotate(-45deg) translate(4px, -4px);
      }
      .nav-cta {
        font-family: var(--font-ui);
        font-size: 0.76rem;
        font-weight: 600;
        letter-spacing: 0;
        text-transform: none;
        background: var(--white);
        color: var(--black);
        padding: 9px 20px;
        border: none;
        cursor: pointer;
        border-radius: 100px;
        transition:
          transform 0.35s var(--ease-luxury),
          background 0.35s var(--ease-smooth);
        flex-shrink: 0;
      }
      .nav-cta:hover {
        background: var(--neon);
      }
      .nav-cta:active {
        transform: scale(0.95);
      }

      /* ── AUTH SECTION (header) ── */
      .nav-auth {
        display: none;
        align-items: center;
        gap: 14px;
        flex-shrink: 0;
      }
      .auth-guest {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .auth-link-login {
        font-family: var(--font-ui);
        font-size: 0.78rem;
        font-weight: 500;
        color: var(--dim);
        text-decoration: none;
        position: relative;
        transition: color 0.3s var(--ease-smooth);
      }
      .auth-link-login::after {
        content: "";
        position: absolute;
        bottom: -5px;
        right: 0;
        left: 0;
        height: 1px;
        background: var(--neon);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.4s var(--ease-luxury);
      }
      .auth-link-login:hover {
        color: var(--white);
      }
      .auth-link-login:hover::after {
        transform: scaleX(1);
      }

      .auth-user {
        position: relative;
      }
      .auth-user-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 100px;
        padding: 6px 16px 6px 8px;
        font-family: var(--font-ui);
        font-size: 0.76rem;
        font-weight: 600;
        color: var(--white);
        cursor: pointer;
        transition:
          border-color 0.3s var(--ease-smooth),
          background 0.3s var(--ease-smooth);
      }
      .auth-user-btn:hover {
        border-color: var(--border-lit);
        background: rgba(255, 255, 255, 0.02);
      }
      .auth-user-avatar {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: rgba(79, 216, 255, 0.14);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.82rem;
        flex-shrink: 0;
        line-height: 1;
      }
      .auth-user-menu {
        position: absolute;
        top: calc(100% + 12px);
        right: 0;
        min-width: 190px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--r-md);
        box-shadow: var(--shadow-lift);
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-8px);
        transition:
          opacity 0.25s var(--ease-smooth),
          transform 0.25s var(--ease-smooth),
          visibility 0.25s;
        z-index: 1001;
      }
      .auth-user-menu.open {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }
      .auth-user-menu a {
        font-family: var(--font-ui);
        font-size: 0.78rem;
        color: var(--dim);
        text-decoration: none;
        padding: 9px 12px;
        border-radius: var(--r-sm);
        transition:
          background 0.2s var(--ease-smooth),
          color 0.2s var(--ease-smooth);
      }
      .auth-user-menu a:hover,
      .auth-user-menu a:focus-visible {
        background: rgba(255, 255, 255, 0.05);
        color: var(--white);
      }
      .auth-user-menu a.auth-logout {
        color: #ff8a8a;
        border-top: 1px solid var(--border);
        margin-top: 4px;
        padding-top: 11px;
      }
      .auth-user-menu a.auth-logout:hover {
        background: rgba(255, 108, 108, 0.08);
      }

      @media (min-width: 768px) {
        .nav-auth {
          display: flex;
        }
      }

      /* ── CART BUTTON (header) ──
   ROOT CAUSE OF ISSUE 1: the cart button was never added to the DOM at all —
   there was no markup for it anywhere in <nav>, so no CSS rule could have hidden
   it either. This is a pure addition, not a fix to existing broken code.
   It's placed in a wrapping ".nav-right-cluster" alongside .nav-auth and
   .nav-menu-btn (rather than as a 5th direct child of <nav>) because <nav> uses
   justify-content:space-between: adding a 5th top-level child would spread the
   cart icon into the middle of the header instead of anchoring it next to the
   auth controls / hamburger, breaking the current layout. Wrapping preserves the
   existing 3-column space-between behavior exactly. The button reuses the same
   40x40 / border / border-radius treatment as .nav-menu-btn so it matches the
   current design language, and it is NOT display:none at any breakpoint, so it
   works identically on mobile and desktop. */
      .nav-right-cluster {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-shrink: 0;
      }
      .nav-cart-btn {
        position: relative;
        width: 40px;
        height: 40px;
        background: transparent;
        border: 1px solid var(--border);
        border-radius: var(--r-sm);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
        transition:
          border-color 0.35s var(--ease-smooth),
          background 0.35s var(--ease-smooth);
        flex-shrink: 0;
      }
      .nav-cart-btn:hover {
        border-color: var(--border-lit);
        background: rgba(255, 255, 255, 0.02);
      }
      .nav-cart-btn:active {
        transform: scale(0.95);
      }
      .nav-cart-icon {
        width: 18px;
        height: 18px;
        stroke: var(--dim);
        fill: none;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: stroke 0.3s var(--ease-smooth);
      }
      .nav-cart-btn:hover .nav-cart-icon {
        stroke: var(--white);
      }
      .nav-cart-badge {
        position: absolute;
        top: -5px;
        left: -5px;
        min-width: 16px;
        height: 16px;
        padding: 0 4px;
        background: var(--neon);
        color: var(--black);
        font-family: var(--font-mono);
        font-size: 0.6rem;
        font-weight: 600;
        border-radius: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
        direction: ltr;
        box-shadow: 0 0 0 2px var(--black);
      }
      .nav-cart-badge[hidden] {
        display: none;
      }

      /* Mobile-only auth block, lives inside the drawer since the fixed nav bar has no room */
      .drawer-auth {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        margin-top: 22px;
      }
      .drawer-auth-link {
        font-family: var(--font-ui);
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--dim);
        text-decoration: none;
        padding: 12px 30px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 100px;
        transition: all 0.35s var(--ease-smooth);
      }
      .drawer-auth-link:hover {
        border-color: var(--neon);
        color: var(--neon);
      }
      .drawer-auth-register {
        font-family: var(--font-ui);
        font-size: 0.78rem;
        font-weight: 600;
        background: var(--white);
        color: var(--black);
        padding: 15px 46px;
        border: none;
        cursor: pointer;
        border-radius: 100px;
      }
      .drawer-auth-user {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        margin-top: 22px;
      }
      .drawer-user-info {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--white);
        font-family: var(--font-ui);
        font-weight: 600;
        font-size: 0.95rem;
        margin-bottom: 10px;
      }
      .drawer-auth-user a {
        font-family: var(--font-ui);
        font-size: 0.85rem;
        color: var(--dim);
        text-decoration: none;
        padding: 9px 0;
        transition: color 0.3s var(--ease-smooth);
      }
      .drawer-auth-user a:hover {
        color: var(--neon);
      }
      .drawer-auth-user a.auth-logout {
        color: #ff8a8a;
      }

      /* Mobile drawer */
      .mobile-drawer {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(5, 5, 8, 0.98);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        z-index: 999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        transform: translateY(-100%);
        transition: transform 0.6s var(--ease-luxury);
        padding-top: 80px;
        overflow-y: auto;
      }
      .mobile-drawer.open {
        transform: translateY(0);
      }
      .mobile-drawer a {
        font-family: var(--font-display);
        font-weight: 500;
        font-size: 1.9rem;
        letter-spacing: 0.02em;
        color: var(--dim);
        text-decoration: none;
        padding: 12px 0;
        transition:
          color 0.35s var(--ease-smooth),
          transform 0.35s var(--ease-smooth);
        display: block;
        text-align: center;
      }
      .mobile-drawer a:hover,
      .mobile-drawer a:active {
        color: var(--neon);
        transform: translateX(-6px);
      }
      .mobile-drawer-cta {
        margin-top: 26px;
        font-family: var(--font-ui);
        font-size: 0.78rem;
        font-weight: 600;
        background: var(--white);
        color: var(--black);
        padding: 15px 46px;
        border: none;
        cursor: pointer;
        border-radius: 100px;
      }

      /* ── SECTIONS WRAPPER ── */
      #sections-wrapper {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100dvh;
        will-change: transform;
        transition: transform var(--transition-duration) var(--ease-out-expo);
      }
      /* ── SLIDE BASE ── */
      .slide {
        position: absolute;
        left: 0;
        width: 100vw;
        height: 100dvh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 0 20px;
        width: 100%;
      }
      .section-label {
        font-family: var(--font-mono);
        font-size: 0.68rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--neon);
        margin-bottom: 12px;
        display: block;
        font-weight: 500;
      }
      .section-title {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: clamp(2rem, 7vw, 4.6rem);
        line-height: 1.15;
        letter-spacing: 0;
        color: var(--white);
      }
      /* ── SLIDE ANIMATIONS ── */
      .slide-anim {
        opacity: 0;
        transform: translateY(22px);
        transition:
          opacity 0.9s var(--ease-out-expo),
          transform 0.9s var(--ease-out-expo);
      }
      .slide-anim-left {
        opacity: 0;
        transform: translateX(-28px);
        transition:
          opacity 0.9s var(--ease-out-expo),
          transform 0.9s var(--ease-out-expo);
      }
      .slide-anim-right {
        opacity: 0;
        transform: translateX(28px);
        transition:
          opacity 0.9s var(--ease-out-expo),
          transform 0.9s var(--ease-out-expo);
      }
      .slide-anim-scale {
        opacity: 0;
        transform: scale(0.96);
        transition:
          opacity 0.9s var(--ease-out-expo),
          transform 0.9s var(--ease-out-expo);
      }
      .slide.active .slide-anim,
      .slide.active .slide-anim-left,
      .slide.active .slide-anim-right,
      .slide.active .slide-anim-scale {
        opacity: 1;
        transform: none;
      }
      .d-1 {
        transition-delay: 0.06s !important;
      }
      .d-2 {
        transition-delay: 0.12s !important;
      }
      .d-3 {
        transition-delay: 0.18s !important;
      }
      .d-4 {
        transition-delay: 0.24s !important;
      }
      .d-5 {
        transition-delay: 0.3s !important;
      }
      .d-6 {
        transition-delay: 0.36s !important;
      }
      .d-7 {
        transition-delay: 0.42s !important;
      }
      .d-8 {
        transition-delay: 0.48s !important;
      }
      .word-reveal .word {
        display: inline-block;
        overflow: hidden;
        vertical-align: bottom;
        margin-left: 0.16em;
      }
      .word-reveal .word span {
        display: inline-block;
        opacity: 0;
        transform: translateY(105%);
        transition:
          opacity 0.7s var(--ease-out-expo),
          transform 0.7s var(--ease-out-expo);
      }
      .slide.active .word-reveal .word span {
        opacity: 1;
        transform: translateY(0);
      }

      /* ══════════════════════════════════════════
SLIDE 0: HERO
══════════════════════════════════════════ */
      #hero {
        background: var(--black);
      }
      .hero-ambient {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background:
          radial-gradient(
            ellipse 90% 50% at 50% 35%,
            rgba(79, 216, 255, 0.07) 0%,
            transparent 55%
          ),
          radial-gradient(
            ellipse 60% 40% at 15% 85%,
            rgba(139, 123, 255, 0.05) 0%,
            transparent 50%
          ),
          linear-gradient(180deg, #050508 0%, #07070d 100%);
      }
      .hero-grid {
        position: absolute;
        bottom: 0;
        left: -10%;
        right: -10%;
        height: 40%;
        pointer-events: none;
        z-index: 1;
        background-image:

        display: flex;
        align-items: center;
        gap: 9px;
        margin-top: auto;
        flex-shrink: 0;
      }
      .testi-avatar-m {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Space Grotesk", sans-serif;
        font-weight: 600;
        font-size: 0.72rem;
        color: var(--black);
        flex-shrink: 0;
        direction: ltr;
      }
      .testi-name-m {
        font-family: var(--font-ui);
        font-size: 0.72rem;
        font-weight: 600;
        color: var(--white);
      }
      .testi-loc-m {
        font-family: var(--font-body);
        font-size: 0.62rem;
        color: var(--muted);
      }
      .testi-count-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-family: var(--font-mono);
        font-size: 1.4rem;
        color: var(--neon);
        line-height: 1;
        font-weight: 500;
      }
      .testi-count-label {
        font-family: var(--font-ui);
        font-size: 0.58rem;
        letter-spacing: 0;
        text-transform: none;
        color: var(--muted);
        margin-top: 3px;
      }

      /* ══════════════════════════════════════════
SLIDE 4: GUIDE — MOBILE
══════════════════════════════════════════ */
      #guide {
        background: var(--black);
        align-items: flex-start;
      }
      .guide-mobile-wrap {
        width: 100%;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        padding-top: var(--nav-h);
        overflow: hidden;
      }
      .guide-header-m {
        padding: 20px 22px 16px;
        flex-shrink: 0;
        border-bottom: 1px solid var(--border);
      }
      .guide-header-m .section-title {
        font-size: clamp(1.6rem, 6.4vw, 2.2rem);
      }
      .guide-list {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        scrollbar-width: none;
        -ms-overflow-style: none;
        padding: 16px 18px 18px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .guide-list::-webkit-scrollbar {
        display: none;
      }
      .guide-card-m {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-md);
        overflow: hidden;
        display: flex;
        gap: 0;
        transition: border-color 0.35s var(--ease-smooth);
        flex-shrink: 0;
        -webkit-tap-highlight-color: transparent;
      }
      .guide-card-m:active {
        border-color: var(--border-lit);
      }
      .guide-img-m {
        width: 92px;
        flex-shrink: 0;
        background: var(--card);
        overflow: hidden;
        min-height: 92px;
      }
      .guide-img-m img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .guide-img-m.placeholder {
        background: linear-gradient(150deg, #07101a, #0c1c2c);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .guide-placeholder-icon {
        font-size: 1.7rem;
        opacity: 0.28;
      }
      .guide-content-m {
        padding: 14px 15px;
        flex: 1;
        min-width: 0;
      }
      .guide-cat-m {
        font-family: var(--font-mono);
        font-size: 0.58rem;
        letter-spacing: 0;
        text-transform: none;
        color: var(--neon);
        margin-bottom: 5px;
      }
      .guide-title-m {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 0.98rem;
        letter-spacing: 0;
        color: var(--white);
        line-height: 1.35;
        margin-bottom: 5px;
      }
      .guide-excerpt-m {
        font-family: var(--font-body);
        font-size: 0.72rem;
        color: var(--muted);
        line-height: 1.55;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      /* ══════════════════════════════════════════
SLIDE 5: FINAL — MOBILE (FIXED FOR SCROLLING & OVERFLOW)
══════════════════════════════════════════ */
      #final {
        background: var(--black);
        height: 100dvh !important;
        min-height: 100dvh;
        overflow: visible !important;
        align-items: flex-start !important;
        display: block !important;
      }
      .final-mobile-wrap {
        width: 100%;
        height: 100dvh;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        padding-top: var(--nav-h);
        padding-bottom: calc(24px + env(safe-area-inset-bottom));
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .final-mobile-wrap::-webkit-scrollbar {
        display: none;
      }
      .final-ambient {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background:
          radial-gradient(
            ellipse 100% 60% at 50% 30%,
            rgba(79, 216, 255, 0.05) 0%,
            transparent 55%
          ),
          radial-gradient(
            ellipse 60% 50% at 20% 80%,
            rgba(139, 123, 255, 0.04) 0%,
            transparent 50%
          );
        opacity: 0;
        transition: opacity 1.2s;
      }
      #final.active .final-ambient {
        opacity: 1;
      }
      .promise-header-m {
        padding: 22px 22px 14px;
        position: relative;
        z-index: 1;
        flex-shrink: 0;
      }
      .promise-header-m .section-label {
        margin-bottom: 5px;
      }
      .promise-header-m h3 {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: clamp(1.4rem, 4.6vw, 1.7rem);
        letter-spacing: 0;
        color: var(--white);
        line-height: 1.3;
      }
      .promise-list-m {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        padding: 0 18px 28px 18px;
        position: relative;
        z-index: 1;
        flex-shrink: 0;
      }
      .promise-strip-m {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-md);
        padding: 16px 14px;
        position: relative;
        overflow: hidden;
        transition:
          border-color 0.4s var(--ease-smooth),
          transform 0.4s var(--ease-luxury),
          box-shadow 0.4s var(--ease-smooth);
        -webkit-tap-highlight-color: transparent;
        min-height: 112px;
      }
      .promise-strip-m::before {
        content: "";
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        width: 2px;
        background: var(--pc, var(--neon));
        transform: scaleY(0);
        transform-origin: bottom;
        transition: transform 0.4s var(--ease-luxury);
      }
      .promise-strip-m:active::before {
        transform: scaleY(1);
      }
      .promise-strip-m:active {
        border-color: var(--border-lit);
        transform: scale(0.98);
      }
      .ps-icon-m {
        width: 36px;
        height: 36px;
        flex-shrink: 0;
        border-radius: 50%;
        background: radial-gradient(
          circle at center,
          rgba(var(--pc-rgb, 79, 216, 255), 0.16) 0%,
          rgba(var(--pc-rgb, 79, 216, 255), 0.03) 70%
        );
        border: 1px solid rgba(var(--pc-rgb, 79, 216, 255), 0.22);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 10px;
      }
      .ps-icon-m svg {
        width: 16px;
        height: 16px;
        stroke: var(--pc, var(--neon));
        stroke-width: 1.5;
        fill: none;
      }
      .ps-content-m {
        flex: 1;
        min-width: 0;
        width: 100%;
      }
      .ps-label-m {
        font-family: var(--font-mono);
        font-size: 0.5rem;
        letter-spacing: 0;
        text-transform: none;
        color: var(--muted);
        margin-bottom: 3px;
        opacity: 0.85;
      }
      .ps-title-m {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 0.84rem;
        letter-spacing: 0;
        color: var(--white);
        line-height: 1.3;
        margin-bottom: 5px;
      }
      .ps-desc-m {
        font-family: var(--font-body);
        font-size: 0.62rem;
        color: var(--muted);
        line-height: 1.45;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .ps-badge-m {
        position: absolute;
        top: 14px;
        left: 14px;
        font-family: var(--font-mono);
        font-size: 1.05rem;
        font-weight: 500;
        color: var(--pc, var(--neon));
        line-height: 1;
        flex-shrink: 0;
        text-align: left;
        min-width: auto;
      }
      .ps-badge-unit-m {
        font-size: 0.55rem;
        display: block;
        margin-top: 2px;
        opacity: 0.8;
      }

      /* ── Footer mobile (fixed layout & overflow protected) ── */
      .footer-m {
        padding: 22px 22px calc(26px + env(safe-area-inset-bottom));
        background: var(--deep);
        border-top: 1px solid var(--border);
        position: relative;
        z-index: 1;
        flex-shrink: 0;
        width: 100%;
        max-width: 100vw;
        box-sizing: border-box;
        overflow-x: hidden;
      }
      .footer-brand-row-m {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
        padding-bottom: 18px;
        border-bottom: 1px solid var(--border);
        flex-wrap: wrap;
      }
      .footer-brand-m {
        flex: 1;
        min-width: 150px;
      }
      .footer-logo-m {
        font-family: "Space Grotesk", sans-serif;
        font-weight: 700;
        font-size: 1.2rem;
        letter-spacing: 0.18em;
        color: var(--white);
        display: block;
        margin-bottom: 6px;
        direction: ltr;
      }
      .footer-tagline-m {
        font-family: var(--font-body);
        font-size: 0.7rem;
        color: var(--muted);
        line-height: 1.6;
        max-width: 200px;
        word-wrap: break-word;
      }
      .footer-social-m {
        display: flex;
        gap: 7px;
        margin-top: 12px;
      }
      .footer-social-link-m {
        width: 30px;
        height: 30px;
        border: 1px solid var(--border);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: border-color 0.3s var(--ease-smooth);
        -webkit-tap-highlight-color: transparent;
        flex-shrink: 0;
      }
      .footer-social-link-m:active {
        border-color: var(--neon);
      }
      .footer-social-link-m svg {
        width: 12px;
        height: 12px;
        stroke: var(--muted);
        fill: none;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .footer-nav-m {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 16px;
        margin-bottom: 18px;
      }
      .footer-nav-title-m {
        font-family: var(--font-mono);
        font-size: 0.58rem;
        font-weight: 600;
        letter-spacing: 0;
        text-transform: none;
        color: var(--white);
        margin-bottom: 8px;
        display: block;
      }
      .footer-nav-links-m {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 16px;
      }
      .footer-nav-links-m a {
        font-family: var(--font-body);
        font-size: 0.72rem;
        color: var(--muted);
        text-decoration: none;
        display: block;
        padding: 2px 0;
        white-space: nowrap;
        transition: color 0.25s var(--ease-smooth);
      }
      .footer-nav-links-m a:hover {
        color: var(--dim);
      }
      .newsletter-wrap-m {
        padding-top: 18px;
        border-top: 1px solid var(--border);
      }
      .newsletter-label-m {
        font-family: var(--font-mono);
        font-size: 0.58rem;
        font-weight: 600;
        letter-spacing: 0;
        text-transform: none;
        color: var(--white);
        margin-bottom: 10px;
        display: block;
      }
      .newsletter-row-m {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
        width: 100%;
      }
      .newsletter-input-m {
        flex: 1 1 0%;
        min-width: 0;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 100px;
        padding: 11px 16px;
        font-family: var(--font-body);
        font-size: 0.78rem;
        color: var(--white);
        outline: none;
        transition: border-color 0.25s var(--ease-smooth);
      }
      .newsletter-input-m:focus {
        border-color: var(--neon);
      }
      .newsletter-input-m::placeholder {
        color: var(--muted);
      }
      .newsletter-btn-m {
        background: var(--neon);
        border: none;
        padding: 11px 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        border-radius: 100px;
      }
      .newsletter-btn-m svg {
        width: 13px;
        height: 13px;
        stroke: var(--black);
        stroke-width: 2.5;
        fill: none;
        transform: scaleX(-1);
      }
      .footer-copy-m {
        font-family: var(--font-body);
        font-size: 0.65rem;
        color: var(--muted);
        text-align: center;
        word-wrap: break-word;
        padding-bottom: env(safe-area-inset-bottom);
      }

      /* ── SLIDE INDICATOR ── */
      #nav-dots {
        position: fixed;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        z-index: 500;
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
      }
      .nav-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.18);
        border: 1px solid rgba(255, 255, 255, 0.2);
        cursor: pointer;
        transition: all 0.4s var(--ease-luxury);
      }
      .nav-dot.active {
        background: var(--neon);
        border-color: var(--neon);
        box-shadow: 0 0 10px rgba(79, 216, 255, 0.5);
        transform: scale(1.5);
      }
      #scroll-progress {
        position: fixed;
        top: 0;
        left: 0;
        height: 2px;
        background: linear-gradient(90deg, var(--neon), var(--neon2));
        z-index: 9997;
        width: 0%;
        transition: width 0.5s var(--ease-luxury);
      }
      .fs-anim {
        opacity: 0;
        transform: translateY(18px);
        transition:
          opacity 0.7s var(--ease-out-expo),
          transform 0.7s var(--ease-out-expo);
      }
      .slide.active .fs-anim {
        opacity: 1;
        transform: none;
      }

      /* ══════════════════════════════════════════
RESPONSIVE & BREAKPOINT FIXES
══════════════════════════════════════════ */
      @media (max-width: 360px) {
        .footer-nav-m {
          grid-template-columns: 1fr;
          gap: 12px;
        }
        .footer-brand-row-m {
          flex-direction: column;
        }
        .hero-title {
          font-size: 2.3rem;
        }
        .hero-mini-stat-val {
          font-size: 0.88rem;
        }
        .cat-name-m {
          font-size: 1.28rem;
        }
        .hero-btns {
          flex-direction: column;
        }
        .btn-primary,
        .btn-secondary {
          width: 100%;
        }
        .testi-grid-m {
          gap: 9px;
          padding: 12px 14px 14px;
        }
        .testi-card-m {
          padding: 12px 11px;
        }
        .testi-quote-m {
          font-size: 0.72rem;
        }
      }

      /* ══════════════════════════════════════════
TABLET BREAKPOINT (768px–1023px)
══════════════════════════════════════════ */
      @media (min-width: 768px) and (max-width: 1023px) {
        :root {
          --nav-h: 68px;
        }
        nav {
          padding: 0 36px;
        }
        .nav-menu-btn {
          display: none;
        }
        .nav-links {
          display: flex;
          gap: 24px;
          list-style: none;
        }
        .nav-links a {
          font-family: var(--font-ui);
          font-size: 0.74rem;
          font-weight: 500;
          letter-spacing: 0;
          color: var(--dim);
          text-decoration: none;
          transition: color 0.3s var(--ease-smooth);
          position: relative;
        }
        .nav-links a::after {
          content: "";
          position: absolute;
          bottom: -5px;
          right: 0;
          left: 0;
          height: 1px;
          background: var(--neon);
          transform: scaleX(0);
          transform-origin: left;
          transition: transform 0.4s var(--ease-luxury);
        }
        .nav-links a:hover {
          color: var(--white);
        }
        .nav-links a:hover::after {
          transform: scaleX(1);
        }

        .hero-inner {
          padding: calc(var(--nav-h) + 24px) 36px 34px;
          flex-direction: row;
          align-items: center;
          gap: 44px;
        }
        .hero-inner > div:first-child {
          flex: 0 0 auto;
          max-width: 440px;
        }
        .hero-mobile-img-wrap {
          display: none;
        }
        .hero-right-desktop {
          display: flex;
          flex: 1;
          align-items: center;
          justify-content: center;
        }
        .hero-desktop-img {
          width: 100%;
          max-width: 380px;
          height: auto;
          max-height: 300px;
          object-fit: contain;
          filter: drop-shadow(0 0 60px rgba(79, 216, 255, 0.25))
            drop-shadow(0 30px 80px rgba(0, 0, 0, 0.8));
          opacity: 0;
          transform: translateX(50px) scale(0.92);
          transition:
            opacity 1.3s var(--ease-out-expo) 0.4s,
            transform 1.3s var(--ease-out-expo) 0.4s;
          user-select: none;
        }
        .slide.active .hero-desktop-img {
          opacity: 1;
          transform: none;
        }
        .hero-title {
          font-size: clamp(3.4rem, 8vw, 6.4rem);
        }
        .hero-desc {
          max-width: 380px;
          font-size: 0.92rem;
        }
        .hero-btns {
          max-width: none;
        }
        .btn-primary,
        .btn-secondary {
          flex: 0 0 auto;
          padding: 15px 30px;
          font-size: 0.78rem;
        }

        .cat-mobile-wrap {
          display: none;
        }
        .cat-desktop-wrap {
          display: grid;
          grid-template-columns: 1fr 1fr;
          height: 100dvh;
          padding-top: var(--nav-h);
          width: 100%;
        }
        .cat-visual-panel-d {
          position: relative;
          display: flex;
          align-items: center;
          justify-content: center;
          overflow: hidden;
          background:
            radial-gradient(
              ellipse 80% 70% at 50% 55%,
              rgba(79, 216, 255, 0.09) 0%,
              transparent 60%
            ),
            linear-gradient(180deg, #06060c, #08081a);
          transition: background 0.8s var(--ease-luxury);
        }
        .cat-d-grid {
          position: absolute;
          bottom: 0;
          left: -20%;
          right: -20%;
          height: 55%;
          background-image:
            linear-gradient(rgba(79, 216, 255, 0.05) 1px, transparent 1px),
            linear-gradient(
              90deg,
              rgba(79, 216, 255, 0.05) 1px,
              transparent 1px
            );
          background-size: 64px 64px;
          transform: perspective(500px) rotateX(60deg);
          transform-origin: 50% 100%;
          mask-image: linear-gradient(
            to top,
            rgba(0, 0, 0, 0.5) 0%,
            transparent 50%
          );
          -webkit-mask-image: linear-gradient(
            to top,
            rgba(0, 0, 0, 0.5) 0%,
            transparent 50%
          );
          pointer-events: none;
        }
        .cat-d-scooter {
          position: relative;
          z-index: 2;
          width: 360px;
          height: 240px;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .cat-d-scooter img {
          width: 100%;
          height: 100%;
          object-fit: contain;
          filter: drop-shadow(0 0 40px rgba(79, 216, 255, 0.2));
          opacity: 0;
          transform: scale(0.94);
          transition:
            opacity 0.8s var(--ease-smooth),
            transform 0.8s var(--ease-smooth);
          user-select: none;
        }
        .cat-d-scooter img.visible {
          opacity: 1;
          transform: none;
        }
        .cat-content-panel-d {
          display: flex;
          flex-direction: column;
          justify-content: center;
          padding: 0 32px 0 36px;
          overflow-y: auto;
          scrollbar-width: none;
        }
        .cat-content-panel-d::-webkit-scrollbar {
          display: none;
        }
        .cat-tabs-d {
          display: flex;
          gap: 6px;
          flex-wrap: wrap;
          margin-bottom: 22px;
        }
        .cat-tab-d {
          font-family: var(--font-ui);
          font-size: 0.6rem;
          font-weight: 600;
          letter-spacing: 0;
          text-transform: none;
          padding: 7px 13px;
          border: 1px solid var(--border);
          border-radius: 100px;
          background: transparent;
          color: var(--muted);
          cursor: pointer;
          transition: all 0.3s var(--ease-smooth);
        }
        .cat-tab-d.active {
          color: var(--black);
          border-color: transparent;
        }
        .cat-heading-d {
          font-family: var(--font-display);
          font-weight: 600;
          font-size: clamp(2rem, 3.4vw, 2.8rem);
          line-height: 1.2;
          letter-spacing: 0;
          color: var(--white);
          margin-bottom: 14px;
        }
        .cat-sub-d {
          font-size: 0.86rem;
          color: var(--dim);
          line-height: 1.75;
          margin-bottom: 20px;
          font-family: var(--font-body);
          font-weight: 300;
        }
        .cat-features-d {
          display: flex;
          flex-direction: column;
          gap: 9px;
          margin-bottom: 20px;
        }

    <!-- ============================================================
     JAVASCRIPT — همه دیتاها از API میاد
     ============================================================ -->
    <script>
      /* ════════════════════════════════════
         CONFIG
         ════════════════════════════════════ */
      const API_BASE = "/api/";
      const API_URL = API_BASE + "index/";

      /* ════════════════════════════════════
         LOAD DATA
         ════════════════════════════════════ */
      let pageData = null;

      /* تابع فرمت قیمت */
      function formatPrice(val) {
        if (!val) return "0 تومان";
        const num = parseFloat(val);
        if (isNaN(num)) return val;
        // کلمه تومان + عدد جدا شده
        return "تومان " + num.toLocaleString("fa-IR");
      }

      async function loadIndexData() {
        try {
          const response = await fetch(API_URL);
          if (!response.ok) throw new Error("Failed to fetch index data");
          const data = await response.json();

          // ✅ pageData رو با دیتا پر کن
          pageData = data;

          // 🔍 دیباگ: ببین دیتا چی هست
          console.log("📦 Full API Response:", pageData);
          console.log("📂 Categories:", pageData.categories);
          console.log("📂 Categories type:", typeof pageData.categories);
          console.log("📂 Is Array:", Array.isArray(pageData.categories));

          renderAll();
          setTimeout(() => {
            document.getElementById("loader").classList.add("done");
            setTimeout(() => goToSlide(0), 200);
          }, 500);
        } catch (error) {
          console.error("❌ Error loading index data:", error);
          document.getElementById("loader").innerHTML = `
            <div style="text-align:center;color:var(--muted);">
              <p style="font-size:1.2rem;margin-bottom:12px;">⚠️ خطا در بارگذاری اطلاعات</p>
              <p style="font-size:0.85rem;">لطفاً صفحه را دوباره بارگذاری کنید</p>
              <button onclick="location.reload()" style="margin-top:16px;padding:10px 30px;background:var(--neon);color:var(--black);border:none;border-radius:100px;cursor:pointer;">بارگذاری مجدد</button>
            </div>
          `;
        }
      }

      /* ════════════════════════════════════
         RENDER ALL SECTIONS
         ════════════════════════════════════ */
      function renderAll() {
        if (!pageData) {
          console.warn("⚠️ renderAll: pageData is null, skipping");
          return;
        }

        console.log("🔄 Rendering all sections...");
        renderHero(pageData);
        renderCategories(pageData);
        renderBestSellers(pageData);
        renderTestimonials(pageData);
        renderGuide(pageData);
        renderFinal(pageData);
        updateSEO(pageData);
      }

      /* ════════════════════════════════════
         RENDER HERO
         ════════════════════════════════════ */
      function renderHero(data) {
        const container = document.getElementById("hero-inner");
        if (!container) return;

        const h = data;

        // هدر
        const header = document.createElement("div");
        header.style.flex = "1";
        header.style.minWidth = "0";

        // تگ
        const tag = document.createElement("div");
        tag.className = "hero-tag slide-anim d-1";
        tag.textContent = h.hero_tag || "آینده جابه‌جایی شهری";

        // تصویر موبایل
        const mobileImgWrap = document.createElement("div");
        mobileImgWrap.className = "hero-mobile-img-wrap slide-anim d-2";
        const mobileImg = document.createElement("img");
        mobileImg.className = "hero-mobile-img";
        mobileImg.src = h.hero_mobile_image || "/images/1.png";
        mobileImg.alt = h.hero_image_alt || "اسکوتر برقی Voltex";
        mobileImgWrap.appendChild(mobileImg);

        // عنوان
        const title = document.createElement("h1");
        title.className = "hero-title";
        title.innerHTML = `
          <div class="word-reveal"><span class="word"><span style="transition-delay:0.15s">${h.hero_title_part1 || "متفاوت"}</span></span></div>
          <div class="word-reveal"><span class="word"><span class="line-grad" style="transition-delay:0.28s">${h.hero_title_part2 || "برقی"}</span></span></div>
          <div class="word-reveal"><span class="word"><span style="transition-delay:0.41s">${h.hero_title_part3 || "برانید"}</span></span></div>
        `;

        // آمارها
        const stats = document.createElement("div");
        stats.className = "hero-mini-stats slide-anim d-4";
        const statsData = [
          {
            val: h.hero_stat_1_value || "85",
            unit: h.hero_stat_1_unit || "km/h",
            label: h.hero_stat_1_label || "حداکثر سرعت",
          },
          {
            val: h.hero_stat_2_value || "160",
            unit: h.hero_stat_2_unit || "km",
            label: h.hero_stat_2_label || "برد",
          },
          {
            val: h.hero_stat_3_value || "2",
            unit: h.hero_stat_3_unit || "hr",
            label: h.hero_stat_3_label || "زمان شارژ",
          },
          {
            val: h.hero_stat_4_value || "40k",
            unit: h.hero_stat_4_unit || "+",
            label: h.hero_stat_4_label || "کاربران",
          },
        ];
        statsData.forEach((s) => {
          const stat = document.createElement("div");
          stat.className = "hero-mini-stat";
          stat.innerHTML = `
            <div class="hero-mini-stat-val">${s.val}<span class="hero-mini-stat-unit">${s.unit}</span></div>
            <div class="hero-mini-stat-label">${s.label}</div>
          `;
          stats.appendChild(stat);
        });

        // توضیحات
        const desc = document.createElement("p");
        desc.className = "hero-desc slide-anim d-5";
        desc.textContent =
          h.hero_description ||
          "اسکوترهای برقی پریمیوم، طراحی‌شده برای کسانی که بیشتر می‌خواهند.";

        // دکمه‌ها
        const btns = document.createElement("div");
        btns.className = "hero-btns slide-anim d-6";
        btns.innerHTML = `
          <button class="btn-primary" onclick="goToSlide(2)">${h.hero_btn_text || "مشاهده مجموعه"}</button>
          <button class="btn-secondary" onclick="goToSlide(1)">${h.hero_btn_secondary_text || "کاوش مدل‌ها"}</button>
        `;

        header.appendChild(tag);
        header.appendChild(mobileImgWrap);
        header.appendChild(title);
        header.appendChild(stats);
        header.appendChild(desc);
        header.appendChild(btns);

        // تصویر دسکتاپ
        const desktopRight = document.createElement("div");
        desktopRight.className = "hero-right-desktop";
        const desktopImg = document.createElement("img");
        desktopImg.className = "hero-desktop-img";
        desktopImg.src = h.hero_image || "/images/1.png";
        desktopImg.alt = h.hero_image_alt || "اسکوتر برقی Voltex";
        desktopRight.appendChild(desktopImg);

        container.appendChild(header);
        container.appendChild(desktopRight);
      }

      /* ════════════════════════════════════
         RENDER CATEGORIES
         ════════════════════════════════════ */
      function renderCategories(data) {
        console.log("🔄 renderCategories called with data:", data);

        // ✅ چک کن data وجود دارد
        if (!data) {
          console.error("❌ data is undefined or null");
          return;
        }

        // ✅ چک کن categories وجود دارد
        if (!data.categories) {
          console.error("❌ data.categories is undefined");
          return;
        }

        // ✅ اطمینان از اینکه categories آرایه است
        let categories = data.categories;
        if (!Array.isArray(categories)) {
          console.warn("⚠️ categories is not an array, converting...");
          if (typeof categories === "object") {
            categories = Object.values(categories);
          } else {
            categories = [];
          }
        }

        console.log("📂 Final categories:", categories);
        console.log("📂 Categories length:", categories.length);

        if (!categories.length) {
          console.warn("⚠️ هیچ دسته‌بندی برای نمایش وجود ندارد");
          const desktopWrap = document.getElementById("cat-desktop-wrap");
          if (desktopWrap) {
            desktopWrap.innerHTML = `
              <div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted);">
                <p>هیچ دسته‌بندی برای نمایش وجود ندارد</p>
              </div>
            `;
          }
          return;
        }

        // ===== MOBILE =====
        const mobileWrap = document.getElementById("cat-mobile-wrap");
        if (mobileWrap) {
          mobileWrap.innerHTML = "";

          // تب‌ها
          const tabsStrip = document.createElement("div");
          tabsStrip.className = "cat-tabs-strip";
          tabsStrip.id = "catTabsM";
          categories.forEach((cat, idx) => {
            const btn = document.createElement("button");
            btn.className = `cat-tab-m${idx === 0 ? " active" : ""}`;
            btn.textContent = cat.name || "دسته‌بندی";
            btn.onclick = () => switchCat(idx);
            if (idx === 0) {
              btn.style.background = cat.color_hex || "var(--neon)";
              btn.style.color = "var(--black)";
            }
            tabsStrip.appendChild(btn);
          });
          mobileWrap.appendChild(tabsStrip);

          // ناحیه تصویر
          const imgArea = document.createElement("div");
          imgArea.className = "cat-img-area";
          imgArea.id = "catImgArea";
          const firstCat = categories[0];
          const img = document.createElement("img");
          img.id = "catScooterImgM";
          img.src = firstCat?.image || "/static/images/default-category.jpg";
          img.alt = "تصویر دسته‌بندی اسکوتر";
          img.className = "visible";

          const metrics = document.createElement("div");
          metrics.className = "cat-img-metrics";
          metrics.id = "catMetricsM";
          const features = firstCat?.features || [];
          // در تابع renderCategories بخش دسکتاپ، قسمت features:
          const defaultFeatures = [
            { label: "سرعت", value: "45", unit: "km/h" },
            { label: "برد", value: "80", unit: "km" },
            { label: "وزن", value: "19", unit: "kg" },
            {
              label: "شروع از",
              value: formatPrice("1299000").replace(
                " <small>تومان</small>",
                "",
              ),
              unit: "تومان",
            }, // نمونه عددی
          ];
          const displayFeatures = features.length ? features : defaultFeatures;
          displayFeatures.forEach((f) => {
            const metric = document.createElement("div");
            metric.className = "cat-img-metric";
            metric.innerHTML = `
              <div class="cat-img-metric-val">${f.value || "0"}<span class="cat-img-metric-unit"> ${f.unit || ""}</span></div>
              <div class="cat-img-metric-label">${f.label || ""}</div>
            `;
            metrics.appendChild(metric);
          });

          imgArea.appendChild(img);
          imgArea.appendChild(metrics);
          mobileWrap.appendChild(imgArea);

          // محتوا
          // ===== داخل renderCategories (موبایل) =====
          const content = document.createElement("div");
          content.className = "cat-content-m";
          content.innerHTML = `
            <div class="cat-name-m" id="catNameM">${firstCat?.name || "دسته‌بندی"}</div>
            <div class="cat-sub-m" id="catSubM">${firstCat?.description || ""}</div>
            <div class="cat-btns-m">
              <button class="cat-btn-m primary" id="catBtnM" onclick="window.location.href='/shop/category/${firstCat?.slug || ""}/'" style="background:${firstCat?.color_hex || "var(--neon)"}">مشاهده مجموعه</button>
            </div>
            <div class="cat-dots-m" id="catDotsM">
              ${categories.map((_, idx) => `<div class="cat-dot-m${idx === 0 ? " active" : ""}" onclick="switchCat(${idx})" style="${idx === 0 ? "background:" + (firstCat?.color_hex || "var(--neon)") : ""}"></div>`).join("")}
            </div>
          `;
          mobileWrap.appendChild(content);
        }

        // ===== DESKTOP =====
        const desktopWrap = document.getElementById("cat-desktop-wrap");
        if (desktopWrap) {
          desktopWrap.innerHTML = "";

          const firstCat = categories[0]; // ← اینجا categories تعریف شده

          // پنل تصویر
          const visualPanel = document.createElement("div");
          visualPanel.className = "cat-visual-panel-d";
          visualPanel.id = "catPanelBgD";
          visualPanel.style.background =
            firstCat?.bg ||
            "radial-gradient(ellipse 80% 70% at 50% 55%, rgba(79,216,255,0.1) 0%, transparent 60%), linear-gradient(180deg,#05050b,#08081c)";
          visualPanel.innerHTML = `
            <div class="cat-d-grid"></div>
            <div class="cat-d-scooter">
              <img id="catScooterImgD" src="${firstCat?.image || "/static/images/default-category.jpg"}" alt="تصویر دسته‌بندی اسکوتر" class="visible">
            </div>
          `;
          desktopWrap.appendChild(visualPanel);

          // پنل محتوا
          const contentPanel = document.createElement("div");
          contentPanel.className = "cat-content-panel-d";

          // تب‌ها
          const tabsD = document.createElement("div");
          tabsD.className = "cat-tabs-d";
          tabsD.id = "catTabsD";
          categories.forEach((cat, idx) => {
            const btn = document.createElement("button");
            btn.className = `cat-tab-d${idx === 0 ? " active" : ""}`;
            btn.textContent = cat.name || "دسته‌بندی";
            btn.onclick = () => switchCat(idx);
            if (idx === 0) {
              btn.style.background = cat.color_hex || "var(--neon)";
              btn.style.color = "var(--black)";
            }
            tabsD.appendChild(btn);
          });
          contentPanel.appendChild(tabsD);

          // سایر محتوا
          const features = firstCat?.features || [];
          const defaultFeatures = [
            { label: "سرعت", value: "45", unit: "km/h" },
            { label: "برد", value: "80", unit: "km" },
            { label: "وزن", value: "19", unit: "kg" },
            { label: "شروع از", value: "1,299", unit: "€" },
          ];
          const displayFeatures = features.length ? features : defaultFeatures;

          // ===== داخل renderCategories (دسکتاپ) =====
          const contentHTML = `
            <span class="section-label" id="catLabelD" style="color:${firstCat?.color_hex || "var(--neon)"}">${firstCat?.name || "دسته‌بندی"}</span>
            <div class="cat-heading-d" id="catHeadingD">${firstCat?.name || ""}</div>
            <div class="cat-sub-d" id="catSubD">${firstCat?.description || ""}</div>
            <div class="cat-spec-row-d" id="catSpecRowD">
              ${displayFeatures
                .map(
                  (f) => `
                <div class="cat-spec-d">
                  <div class="cat-spec-val-d">${f.value || "0"}<span class="cat-spec-unit-d" style="color:${firstCat?.color_hex || "var(--neon)"}"> ${f.unit || ""}</span></div>
                  <div class="cat-spec-label-d">${f.label || ""}</div>
                </div>
              `,
                )
                .join("")}
            </div>
            <div class="cat-btns-d">
              <button class="cat-btn-primary-d" id="catBtnD" onclick="window.location.href='/shop/category/${firstCat?.slug || ""}/'" style="background:${firstCat?.color_hex || "var(--neon)"}">مشاهده مجموعه</button>
            </div>
          `;
          contentPanel.insertAdjacentHTML("beforeend", contentHTML);
          desktopWrap.appendChild(contentPanel);
        }

        // ذخیره داده‌های کتگوری برای switchCat
        window._catData = categories;
      }

      /* ════════════════════════════════════
         SWITCH CATEGORY
         ════════════════════════════════════ */
      function switchCat(idx) {
        const categories = window._catData || [];
        if (!categories.length || idx >= categories.length) {
          console.warn("⚠️ switchCat: invalid index or empty categories");
          return;
        }
        const cat = categories[idx];
        if (!cat) {
          console.warn("⚠️ switchCat: category not found at index", idx);
          return;
        }

        // بروزرسانی تب‌ها (موبایل)
        document.querySelectorAll("#catTabsM .cat-tab-m").forEach((btn, i) => {
          if (i === idx) {
            btn.classList.add("active");
            btn.style.background = cat.color_hex || "var(--neon)";
            btn.style.color = "var(--black)";
          } else {
            btn.classList.remove("active");
            btn.style.background = "";
            btn.style.color = "";
          }
        });

        // بروزرسانی تب‌ها (دسکتاپ)
        document.querySelectorAll("#catTabsD .cat-tab-d").forEach((btn, i) => {
          if (i === idx) {
            btn.classList.add("active");
            btn.style.background = cat.color_hex || "var(--neon)";
            btn.style.color = "var(--black)";
          } else {
            btn.classList.remove("active");
            btn.style.background = "";
            btn.style.color = "";
          }
        });

        // بروزرسانی دات‌ها (موبایل)
        document.querySelectorAll("#catDotsM .cat-dot-m").forEach((dot, i) => {
          dot.style.background =
            i === idx ? cat.color_hex || "var(--neon)" : "";
          dot.style.width = i === idx ? "28px" : "";
          dot.classList.toggle("active", i === idx);
        });

        // بروزرسانی تصاویر
        ["catScooterImgM", "catScooterImgD"].forEach((id) => {
          const img = document.getElementById(id);
          if (img && cat.image) {
            img.classList.remove("visible");
            setTimeout(() => {
              img.src = cat.image;
              img.classList.add("visible");
            }, 200);
          }
        });

        // بروزرسانی محتوای موبایل
        const nameM = document.getElementById("catNameM");
        if (nameM) nameM.textContent = cat.name || "";
        const subM = document.getElementById("catSubM");
        if (subM) subM.textContent = cat.description || "";

        // ✅ دکمه موبایل
        const btnM = document.getElementById("catBtnM");
        if (btnM) {
          btnM.style.background = cat.color_hex || "var(--neon)";
          btnM.onclick = function () {
            window.location.href = "/shop/category/" + (cat.slug || "") + "/";
          };
        }

        // بروزرسانی محتوای دسکتاپ
        const labelD = document.getElementById("catLabelD");
        if (labelD) {
          labelD.textContent = cat.name || "";
          labelD.style.color = cat.color_hex || "var(--neon)";
        }
        const headingD = document.getElementById("catHeadingD");
        if (headingD) headingD.textContent = cat.name || "";
        const subD = document.getElementById("catSubD");
        if (subD) subD.textContent = cat.description || "";

        // ✅ دکمه دسکتاپ (یک بار تعریف شده)
        const btnD = document.getElementById("catBtnD");
        if (btnD) {
          btnD.style.background = cat.color_hex || "var(--neon)";
          btnD.onclick = function () {
            window.location.href = "/shop/category/" + (cat.slug || "") + "/";
          };
        }

        // بروزرسانی ویژگی‌ها
        const features = cat.features || [];
        const defaultFeatures = [
          { label: "سرعت", value: "45", unit: "km/h" },
          { label: "برد", value: "80", unit: "km" },
          { label: "وزن", value: "19", unit: "kg" },
          { label: "شروع از", value: "1,299", unit: "€" },
        ];
        const displayFeatures = features.length ? features : defaultFeatures;

        const specRowD = document.getElementById("catSpecRowD");
        if (specRowD) {
          specRowD.innerHTML = displayFeatures
            .map(
              (f) => `
                <div class="cat-spec-d">
                    <div class="cat-spec-val-d">${f.value || "0"}<span class="cat-spec-unit-d" style="color:${cat.color_hex || "var(--neon)"}"> ${f.unit || ""}</span></div>
                    <div class="cat-spec-label-d">${f.label || ""}</div>
                </div>
            `,
            )
            .join("");
        }

        const metricsM = document.getElementById("catMetricsM");
        if (metricsM) {
          metricsM.innerHTML = displayFeatures
            .map(
              (f) => `
                <div class="cat-img-metric">
                    <div class="cat-img-metric-val">${f.value || "0"}<span class="cat-img-metric-unit"> ${f.unit || ""}</span></div>
                    <div class="cat-img-metric-label">${f.label || ""}</div>
                </div>
            `,
            )
            .join("");
        }

        // بروزرسانی رنگ پس‌زمینه
        const bgD = document.getElementById("catPanelBgD");
        if (bgD && cat.bg) bgD.style.background = cat.bg;
      }

      /* ════════════════════════════════════
         RENDER BEST SELLERS
         ════════════════════════════════════ */
      function renderBestSellers(data) {
        const cards = data.product_cards || [];

      // ===== DESKTOP =====
      const desktopWrap = document.getElementById("final-desktop-wrap");

      /* ════════════════════════════════════
         UPDATE SEO
         ════════════════════════════════════ */
      function updateSEO(data) {
        const title = data.meta_title || "VOLTEX — اسکوترهای برقی پریمیوم";
        const desc =
          data.meta_description ||
          "اسکوترهای برقی پریمیوم، طراحی‌شده برای کسانی که بیشتر می‌خواهند.";
        const url = window.location.href;
        const image = data.hero_image || "/images/1.png";

        document.title = title;
        document.getElementById("page-title").textContent = title;
        document.getElementById("meta-description").content = desc;
        document.getElementById("meta-canonical").href = url;

        document.getElementById("og-title").content = title;
        document.getElementById("og-description").content = desc;
        document.getElementById("og-image").content = image;
        document.getElementById("og-url").content = url;

        document.getElementById("twitter-title").content = title;
        document.getElementById("twitter-description").content = desc;
        document.getElementById("twitter-image").content = image;

        // JSON-LD
        const jsonLd = {
          "@context": "https://schema.org",
          "@type": "WebSite",
          name: "VOLTEX",
          description: desc,
          url: url,
          potentialAction: {
            "@type": "SearchAction",
            target: url + "?s={search_term_string}",
            "query-input": "required name=search_term_string",
          },
        };
        document.getElementById("json-ld-website").textContent =
          JSON.stringify(jsonLd);
      }

      /* ════════════════════════════════════
         SLIDE NAVIGATION
         ════════════════════════════════════ */
      const slides = Array.from(document.querySelectorAll(".slide"));
      const wrapper = document.getElementById("sections-wrapper");
      const totalSlides = slides.length;
      let currentSlide = 0;
      let isAnimating = false;

      function goToSlide(index) {
        if (index < 0 || index >= totalSlides) return;
        if (isAnimating) return;
        isAnimating = true;
        slides[currentSlide].classList.remove("active");
        currentSlide = index;
        wrapper.style.transform = `translateY(-${currentSlide * 100}dvh)`;
        const pct =
          totalSlides > 1 ? (currentSlide / (totalSlides - 1)) * 100 : 0;
        document.getElementById("scroll-progress").style.width = pct + "%";
        document.querySelectorAll(".nav-dot").forEach((dot, i) => {
          dot.classList.toggle("active", i === currentSlide);
        });
        setTimeout(() => {
          slides[currentSlide].classList.add("active");
          setTimeout(() => {
            isAnimating = false;
          }, 300);
        }, 60);
      }

      // Nav dots
      const navDots = document.getElementById("nav-dots");
      slides.forEach((_, i) => {
        const dot = document.createElement("div");
        dot.className = "nav-dot";
        dot.addEventListener("click", () => goToSlide(i));
        navDots.appendChild(dot);
      });

      // Wheel navigation
      let wheelAccum = 0,
        wheelTimer = null;
      window.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          wheelAccum += e.deltaY;
          clearTimeout(wheelTimer);
          wheelTimer = setTimeout(() => {
            wheelAccum = 0;
          }, 200);
          if (Math.abs(wheelAccum) > 80) {
            goToSlide(wheelAccum > 0 ? currentSlide + 1 : currentSlide - 1);
            wheelAccum = 0;
          }
        },
        { passive: false },
      );

      // Keyboard navigation
      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowDown" || e.key === "PageDown") {
          e.preventDefault();
          goToSlide(currentSlide + 1);
        }
        if (e.key === "ArrowUp" || e.key === "PageUp") {
          e.preventDefault();
          goToSlide(currentSlide - 1);
        }
      });

      // Touch navigation
      let touchStartY = 0,
        touchStartTime = 0;
      document.addEventListener(
        "touchstart",
        (e) => {
          touchStartY = e.touches[0].clientY;
          touchStartTime = Date.now();
        },
        { passive: true },
      );

      document.addEventListener(
        "touchend",
        (e) => {
          const target = e.target;
          if (
            target.closest(".bs-carousel") ||
            target.closest(".cat-tabs-strip") ||
            target.closest(".guide-list") ||
            target.closest(".final-mobile-wrap")
          )
            return;
          const diff = touchStartY - e.changedTouches[0].clientY;
          const duration = Date.now() - touchStartTime;
          const velocity = Math.abs(diff) / duration;
          if (Math.abs(diff) > 60 || (Math.abs(diff) > 30 && velocity > 0.3)) {
            goToSlide(diff > 0 ? currentSlide + 1 : currentSlide - 1);
          }
        },
        { passive: true },
      );

      // Menu toggle
      function toggleMenu() {
        const btn = document.getElementById("menuBtn");
        const drawer = document.getElementById("mobileDrawer");
        const isOpen = drawer.classList.toggle("open");
        btn.classList.toggle("open", isOpen);
        btn.setAttribute("aria-expanded", isOpen ? "true" : "false");
      }

      function closeMenu() {
        document.getElementById("menuBtn").classList.remove("open");
        document.getElementById("mobileDrawer").classList.remove("open");
        document
          .getElementById("menuBtn")
          .setAttribute("aria-expanded", "false");
      }

      // User menu toggle
      function toggleUserMenu(e) {
        if (e) e.stopPropagation();
        const btn = document.getElementById("authUserBtn");
        const menu = document.getElementById("authUserMenu");
        if (!btn || !menu) return;
        const isOpen = menu.classList.toggle("open");
        btn.setAttribute("aria-expanded", isOpen ? "true" : "false");
      }

      document.addEventListener("click", () => {
        const menu = document.getElementById("authUserMenu");
        const btn = document.getElementById("authUserBtn");
        if (menu && menu.classList.contains("open")) {
          menu.classList.remove("open");
          if (btn) btn.setAttribute("aria-expanded", "false");
        }
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          const menu = document.getElementById("authUserMenu");
          const btn = document.getElementById("authUserBtn");
          if (menu && menu.classList.contains("open")) {
            menu.classList.remove("open");
            if (btn) {
              btn.setAttribute("aria-expanded", "false");
              btn.focus();
            }
          }
        }
      });

      /* ════════════════════════════════════
         START
         ════════════════════════════════════ */
      loadIndexData();
    </script>
