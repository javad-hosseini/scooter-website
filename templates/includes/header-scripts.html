<script>
  /* ════════════════════════════════════
     HEADER & MOBILE DRAWER SCRIPTS
     ════════════════════════════════════ */
  function toggleUserMenu(e) {
    if (e) e.stopPropagation();
    const btn = document.getElementById("authUserBtn");
    const menu = document.getElementById("authUserMenu");
    if (!btn || !menu) return;
    const isOpen = menu.classList.toggle("open");
    btn.setAttribute("aria-expanded", isOpen ? "true" : "false");
  }

  function toggleMenu() {
    const btn = document.getElementById("menuBtn");
    const drawer = document.getElementById("mobileDrawer");
    if (!btn || !drawer) return;
    const isOpen = drawer.classList.toggle("open");
    btn.classList.toggle("open", isOpen);
    btn.setAttribute("aria-expanded", isOpen ? "true" : "false");
  }

  function closeMenu() {
    const btn = document.getElementById("menuBtn");
    const drawer = document.getElementById("mobileDrawer");
    if (btn) btn.classList.remove("open");
    if (drawer) drawer.classList.remove("open");
    if (btn) btn.setAttribute("aria-expanded", "false");
  }

  // Close menus when clicking outside
  document.addEventListener("click", function (e) {
    const menu = document.getElementById("authUserMenu");
    const btn = document.getElementById("authUserBtn");
    if (menu && menu.classList.contains("open")) {
      if (!menu.contains(e.target) && !btn.contains(e.target)) {
        menu.classList.remove("open");
        if (btn) btn.setAttribute("aria-expanded", "false");
      }
    }
  });

  // Close menus on Escape key
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      const menu = document.getElementById("authUserMenu");
      const btn = document.getElementById("authUserBtn");
      if (menu && menu.classList.contains("open")) {
        menu.classList.remove("open");
        if (btn) {
          btn.setAttribute("aria-expanded", "false");
          btn.focus();
        }
      }
      closeMenu();
    }
  });

  // Update cart item count badge
  async function updateCartBadge() {
    const badge = document.getElementById("navCartCount");
    if (!badge) return;
    try {
      const response = await fetch("/shop/api/cart/", {
        headers: { "X-Requested-With": "XMLHttpRequest" }
      });
      if (response.ok) {
        const data = await response.json();
        const count = data.item_count ?? data.total_items ?? (Array.isArray(data.items) ? data.items.length : 0);
        if (count > 0) {
          badge.textContent = count;
          badge.removeAttribute("hidden");
        } else {
          badge.setAttribute("hidden", "");
        }
      }
    } catch (error) {
      console.warn("Could not fetch cart badge count:", error);
    }
  }

  document.addEventListener("DOMContentLoaded", function () {
    updateCartBadge();
  });
</script>
