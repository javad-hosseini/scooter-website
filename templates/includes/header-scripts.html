<script>
  /* ════════════════════════════════════
   HEADER AUTH & MENU
═══════════════════════════════════════ */
  function toggleUserMenu(e) {
    if (e) e.stopPropagation();
    const btn = document.getElementById("authUserBtn");
    const menu = document.getElementById("authUserMenu");
    if (!btn || !menu) return;
    const isOpen = menu.classList.toggle("open");
    btn.setAttribute("aria-expanded", isOpen ? "true" : "false");
  }

  function toggleMenu() {
    const btn = document.getElementById("menuBtn");
    const drawer = document.getElementById("mobileDrawer");
    if (!btn || !drawer) return;
    const isOpen = drawer.classList.toggle("open");
    btn.classList.toggle("open", isOpen);
    btn.setAttribute("aria-expanded", isOpen ? "true" : "false");
  }

  function closeMenu() {
    const btn = document.getElementById("menuBtn");
    const drawer = document.getElementById("mobileDrawer");
    if (btn) btn.classList.remove("open");
    if (drawer) drawer.classList.remove("open");
    if (btn) btn.setAttribute("aria-expanded", "false");
  }

  // بستن منو با کلیک خارج از آن
  document.addEventListener("click", function (e) {
    // بستن منوی کاربر
    const menu = document.getElementById("authUserMenu");
    const btn = document.getElementById("authUserBtn");
    if (menu && menu.classList.contains("open")) {
      if (!menu.contains(e.target) && !btn.contains(e.target)) {
        menu.classList.remove("open");
        if (btn) btn.setAttribute("aria-expanded", "false");
      }
    }
  });

  // بستن با کلید Escape
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      const menu = document.getElementById("authUserMenu");
      const btn = document.getElementById("authUserBtn");
      if (menu && menu.classList.contains("open")) {
        menu.classList.remove("open");
        if (btn) {
          btn.setAttribute("aria-expanded", "false");
          btn.focus();
        }
      }
      closeMenu();
    }
  });

  /* ════════════════════════════════════
   CHECK USER LOGIN STATUS
═══════════════════════════════════════ */
  async function checkUserStatus() {
    try {
      const response = await fetch("/api/user/status/");
      if (response.ok) {
        const data = await response.json();
        if (data.is_authenticated) {
          showLoggedInUser(data.user);
        } else {
          showLoggedOutUser();
        }
      }
    } catch (error) {
      console.error("Error checking user status:", error);
    }
  }

  function showLoggedInUser(user) {
    document.getElementById("authGuest").style.display = "none";
    document.getElementById("authUser").style.display = "flex";
    document.getElementById("drawerAuthGuest").style.display = "none";
    document.getElementById("drawerAuthUser").style.display = "flex";

    document.getElementById("userName").textContent =
      user.full_name || user.username;
    document.getElementById("drawerUserName").textContent =
      user.full_name || user.username;

    const avatar = document.getElementById("userAvatar");
    if (user.avatar) {
      avatar.innerHTML = `<img src="${user.avatar}" alt="${user.full_name}">`;
    } else {
      avatar.textContent = (user.full_name || user.username || "U")
        .charAt(0)
        .toUpperCase();
    }
  }

  function showLoggedOutUser() {
    document.getElementById("authGuest").style.display = "flex";
    document.getElementById("authUser").style.display = "none";
    document.getElementById("drawerAuthGuest").style.display = "flex";
    document.getElementById("drawerAuthUser").style.display = "none";
  }

  // ===== اجرا در زمان بارگذاری صفحه =====
  document.addEventListener("DOMContentLoaded", function () {
    checkUserStatus();

    // بروزرسانی تعداد سبد خرید (اختیاری)
    updateCartCount();
  });

  async function updateCartCount() {
    try {
      const response = await fetch("/api/cart/count/");
      if (response.ok) {
        const data = await response.json();
        const badge = document.getElementById("navCartCount");
        if (data.count > 0) {
          badge.textContent = data.count;
          badge.removeAttribute("hidden");
        } else {
          badge.setAttribute("hidden", "");
        }
      }
    } catch (error) {
      console.error("Error updating cart count:", error);
    }
  }
</script>
