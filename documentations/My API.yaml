          title: برچسب
          maxLength: 100
      required:
        - id
        - label
        - number
    Tag:
      type: object
      properties:
        name:
          type: string
          maxLength: 50
        slug:
          type: string
          pattern: ^[-\w]+$
          maxLength: 60
      required:
        - name
        - slug
    TrustBadge:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        icon:
          type: string
          title: آیکون
          description: آیکون فونت‌آ‌وسم یا ایموجی
          maxLength: 50
        label:
          type: string
          title: برچسب
          maxLength: 100
        value:
          type: string
          title: مقدار
          maxLength: 100
      required:
        - id
        - label
    UserLogin:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          writeOnly: true
      required:
        - password
        - username
    UserRegistration:
      type: object
      properties:
        fullname:
          type: string
          title: نام کامل
          maxLength: 100
        username:
          type: string
          description:
            Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          maxLength: 150
        mobile:
          type: string
          title: شماره موبایل
          maxLength: 11
        email:
          type: string
          format: email
          title: ایمیل
          maxLength: 254
        password1:
          type: string
          writeOnly: true
          minLength: 8
        password2:
          type: string
          writeOnly: true
        agree_terms:
          type: boolean
          writeOnly: true
      required:
        - agree_terms
        - email
        - fullname
        - mobile
        - password1
        - password2
        - username
    Wishlist:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product:
          allOf:
            - $ref: "#/components/schemas/ProductList"
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - created_at
        - id
        - product
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
