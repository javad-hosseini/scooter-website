<!doctype html>
{% load socialaccount %}
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>ورود | پنل مدیریت فروش اسکوتر VOLTEX</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #020617;
        --surface: #0f172a;
        --surface-2: #111b30;
        --accent: #06b6d4;
        --accent-2: #22d3ee;
        --success: #22c55e;
        --danger: #ef4444;
        --text: #ffffff;
        --text-mid: rgba(255, 255, 255, 0.66);
        --text-low: rgba(255, 255, 255, 0.4);
        --glass: rgba(255, 255, 255, 0.045);
        --glass-strong: rgba(255, 255, 255, 0.09);
        --border: rgba(255, 255, 255, 0.13);
        --ease: cubic-bezier(0.4, 0, 0.2, 1);
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font-family: "Vazirmatn", sans-serif;
        background: var(--bg);
        color: var(--text);
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: inherit;
      }
      ::selection {
        background: rgba(6, 182, 212, 0.35);
      }

      .auth-page {
        position: relative;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
        perspective: 1400px;
      }
      .bg-fx {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        background: var(--bg);
      }
      .grid-overlay {
        position: absolute;
        inset: -2px;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.035) 1px,
            transparent 1px
          );
        background-size: 46px 46px;
        mask-image: radial-gradient(
          ellipse 80% 70% at 50% 45%,
          #000 35%,
          transparent 85%
        );
        opacity: 0.6;
      }
      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        will-change: transform;
      }
      .blob-1 {
        width: 560px;
        height: 560px;
        top: -180px;
        right: -160px;
        background: radial-gradient(
          circle,
          rgba(6, 182, 212, 0.32),
          transparent 70%
        );
        animation: drift1 22s ease-in-out infinite;
      }
      .blob-2 {
        width: 480px;
        height: 480px;
        bottom: -200px;
        left: -140px;
        background: radial-gradient(
          circle,
          rgba(139, 92, 246, 0.26),
          transparent 70%
        );
        animation: drift2 26s ease-in-out infinite;
      }
      .blob-3 {
        width: 380px;
        height: 380px;
        top: 40%;
        left: 50%;
        background: radial-gradient(
          circle,
          rgba(34, 211, 238, 0.16),
          transparent 70%
        );
        animation: drift3 30s ease-in-out infinite;
      }
      @keyframes drift1 {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        50% {
          transform: translate(-60px, 60px) scale(1.12);
        }
      }
      @keyframes drift2 {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        50% {
          transform: translate(50px, -40px) scale(1.08);
        }
      }
      @keyframes drift3 {
        0%,
        100% {
          transform: translate(-50%, -50%) scale(1);
        }
        50% {
          transform: translate(-46%, -54%) scale(1.18);
        }
      }
      #particleCanvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .shape {
        position: absolute;
        border-radius: 28px;
        background: linear-gradient(
          150deg,
          rgba(255, 255, 255, 0.08),
          rgba(255, 255, 255, 0.015)
        );
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(6px);
        box-shadow: 0 20px 60px -20px rgba(0, 0, 0, 0.6);
        will-change: transform;
      }
      .shape-a {
        width: 96px;
        height: 96px;
        top: 14%;
        left: 10%;
        border-radius: 50%;
        animation: floatA 9s ease-in-out infinite;
      }
      .shape-b {
        width: 64px;
        height: 64px;
        bottom: 18%;
        right: 9%;
        transform: rotate(20deg);
        animation: floatB 11s ease-in-out infinite;
      }
      .shape-c {
        width: 46px;
        height: 46px;
        top: 22%;
        right: 16%;
        border-radius: 14px;
        transform: rotate(-12deg);
        animation: floatC 8s ease-in-out infinite;
      }
      .shape-d {
        width: 130px;
        height: 130px;
        bottom: 10%;
        left: 14%;
        border-radius: 38% 62% 60% 40%/40% 45% 55% 60%;
        animation: floatD 13s ease-in-out infinite;
      }
      @keyframes floatA {
        0%,
        100% {
          transform: translateY(0) rotate(0deg);
        }
        50% {
          transform: translateY(-26px) rotate(8deg);
        }
      }
      @keyframes floatB {
        0%,
        100% {
          transform: translateY(0) rotate(20deg);
        }
        50% {
          transform: translateY(22px) rotate(34deg);
        }
      }
      @keyframes floatC {
        0%,
        100% {
          transform: translateY(0) rotate(-12deg);
        }
        50% {
          transform: translateY(-16px) rotate(2deg);
        }
      }
      @keyframes floatD {
        0%,
        100% {
          transform: translateY(0) rotate(0deg);
        }
        50% {
          transform: translateY(18px) rotate(-10deg);
        }
      }
      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse 70% 60% at 50% 50%,
          transparent 40%,
          rgba(2, 6, 23, 0.75) 100%
        );
      }
      .noise-veil {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(2, 6, 23, 0) 0%,
          rgba(2, 6, 23, 0.5) 100%
        );
      }

      .auth-card {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 440px;
        padding: 2.6rem 2.3rem 2.1rem;
        border-radius: 28px;
        background: linear-gradient(
          165deg,
          rgba(255, 255, 255, 0.07),
          rgba(255, 255, 255, 0.02)
        );
        border: 1px solid var(--border);
        backdrop-filter: blur(22px) saturate(140%);
        box-shadow:
          0 30px 80px -25px rgba(0, 0, 0, 0.65),
          0 0 0 1px rgba(255, 255, 255, 0.02) inset,
          0 0 60px -20px rgba(6, 182, 212, 0.18);
        opacity: 0;
        transform: translateY(34px) scale(0.96);
        animation:
          cardIn 0.85s var(--ease) 0.15s forwards,
          floatCard 7s ease-in-out 1.1s infinite;
        transform-style: preserve-3d;
      }
      @keyframes cardIn {
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      @keyframes floatCard {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-9px);
        }
      }
      .auth-card::before {
        content: "";
        position: absolute;
        inset: -1px;
        border-radius: 29px;
        padding: 1px;
        background: linear-gradient(
          135deg,
          rgba(6, 182, 212, 0.55),
          rgba(255, 255, 255, 0.04) 30%,
          rgba(139, 92, 246, 0.35) 70%,
          rgba(6, 182, 212, 0.4)
        );
        -webkit-mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        opacity: 0.55;
        pointer-events: none;
      }

      .brand-area {
        text-align: center;
        margin-bottom: 1.6rem;
        opacity: 0;
        animation: fadeUp 0.7s var(--ease) 0.35s forwards;
      }
      .brand-mark {
        width: 60px;
        height: 60px;
        margin: 0 auto 1rem;
        border-radius: 18px;
        background: linear-gradient(135deg, var(--accent), #7c3aed);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 12px 30px -8px rgba(6, 182, 212, 0.55);
        position: relative;
        animation: markPulse 3.4s ease-in-out infinite;
      }
      .brand-mark svg {
        width: 30px;
        height: 30px;
      }
      .brand-mark::after {
        content: "";
        position: absolute;
        inset: -7px;
        border-radius: 22px;
        border: 1px solid rgba(6, 182, 212, 0.4);
        opacity: 0;
        animation: markRing 3.4s ease-out infinite;
      }
      @keyframes markPulse {
        0%,
        100% {
          box-shadow: 0 12px 30px -8px rgba(6, 182, 212, 0.55);
        }
        50% {
          box-shadow: 0 12px 38px -6px rgba(6, 182, 212, 0.85);
        }
      }
      @keyframes markRing {
        0% {
          opacity: 0.7;
          transform: scale(0.9);
        }
        100% {
          opacity: 0;
          transform: scale(1.25);
        }
      }
      .brand-area .word {
        font-size: 0.78rem;
        letter-spacing: 0.22em;
        color: var(--accent-2);
        font-weight: 700;
        margin-bottom: 0.3rem;
      }
      .brand-area h1 {
        font-size: 1.32rem;
        font-weight: 800;
        margin: 0 0 0.45rem;
        line-height: 1.5;
      }
      .brand-area p {
        font-size: 0.85rem;
        color: var(--text-mid);
        margin: 0;
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .field {
        position: relative;
        margin-bottom: 1.25rem;
        opacity: 0;
        animation: fadeUp 0.7s var(--ease) forwards;
      }
      .field:nth-of-type(1) {
        animation-delay: 0.45s;
      }
      .field:nth-of-type(2) {
        animation-delay: 0.55s;
      }
      .field .control {
        position: relative;
        display: flex;
        align-items: center;
        border-radius: 14px;
        border: 1px solid var(--border);
        background: var(--glass);
        transition:
          border-color 0.3s var(--ease),
          box-shadow 0.3s var(--ease),
          transform 0.2s var(--ease),
          background 0.3s var(--ease);
      }
      .field .control:hover {
        border-color: rgba(6, 182, 212, 0.45);
        transform: translateY(-2px);
        background: var(--glass-strong);
      }
      .field .control:focus-within {
        border-color: var(--accent);
        box-shadow:
          0 0 0 4px rgba(6, 182, 212, 0.16),
          0 0 24px -6px rgba(6, 182, 212, 0.55);
        background: var(--glass-strong);
      }
      .field.is-invalid .control {
        border-color: var(--danger);
        box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.14);
        animation: shake 0.45s var(--ease);
      }
      .field.is-valid .control {
        border-color: var(--success);
        box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.12);
      }
      @keyframes shake {
        10%,
        90% {
          transform: translateX(-1px);
        }
        20%,
        80% {
          transform: translateX(2px);
        }
        30%,
        50%,
        70% {
          transform: translateX(-4px);
        }
        40%,
        60% {
          transform: translateX(4px);
        }
      }
      .field .ic {
        flex-shrink: 0;
        width: 50px;
        height: 54px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-low);
        font-size: 1.05rem;
        transition: color 0.3s var(--ease);
      }
      .field .control:focus-within .ic {
        color: var(--accent-2);
      }
      .field.is-invalid .ic {
        color: var(--danger);
      }
      .field.is-valid .ic {
        color: var(--success);
      }
      .field input {
        flex: 1;
        min-width: 0;
        height: 54px;
        padding: 1.1rem 0.25rem 0.3rem 0;
        background: transparent;
        border: 0;
        outline: 0;
        color: var(--text);
        font-family: inherit;
        font-size: 0.92rem;
      }
      .field input::placeholder {
        color: transparent;
      }
      .field label {
        position: absolute;
        right: 50px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 0.86rem;
        color: var(--text-low);
        pointer-events: none;
        transition: all 0.25s var(--ease);
        background: transparent;
        padding: 0 0.2rem;
      }
      .field input:focus + label,
      .field input:not(:placeholder-shown) + label {
        top: 0.2rem;
        font-size: 0.68rem;
        transform: translateY(0);
        color: var(--accent-2);
        font-weight: 600;
      }
      .field.is-invalid input:not(:placeholder-shown) + label {
        color: var(--danger);
      }
      .field.is-valid input:not(:placeholder-shown) + label {
        color: var(--success);
      }
      .toggle-pass {
        flex-shrink: 0;
        width: 46px;
        height: 54px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        border: 0;
        color: var(--text-low);
        font-size: 1rem;
        transition: color 0.2s var(--ease);
      }
      .toggle-pass:hover {
        color: var(--accent-2);
      }
      .field-msg {
        font-size: 0.72rem;
        color: var(--danger);
        margin: 0.35rem 0.3rem 0;
        min-height: 1rem;
        opacity: 0;
        transition: opacity 0.25s var(--ease);
      }
      .field.is-invalid .field-msg {
        opacity: 1;
      }

      .row-between {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 0.2rem 0 1.5rem;
        opacity: 0;
        animation: fadeUp 0.7s var(--ease) 0.65s forwards;
      }
      .chk-wrap {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        cursor: pointer;
        user-select: none;
      }
      .chk-wrap input {
        display: none;
      }
      .chk-box {
        width: 19px;
        height: 19px;
        border-radius: 6px;
        border: 1.5px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--glass);
        transition: all 0.25s var(--ease);
        flex-shrink: 0;
      }
      .chk-wrap input:checked + .chk-box {
        background: linear-gradient(135deg, var(--accent), #7c3aed);
        border-color: transparent;
        box-shadow: 0 0 14px rgba(6, 182, 212, 0.5);
      }
      .chk-box svg {
        width: 11px;
        height: 11px;
        opacity: 0;
        transform: scale(0.6);
        transition: all 0.2s var(--ease);
      }
      .chk-wrap input:checked + .chk-box svg {
        opacity: 1;
        transform: scale(1);
      }
      .chk-wrap span {
        font-size: 0.8rem;
        color: var(--text-mid);
      }
      .forgot-link {
        font-size: 0.8rem;
        color: var(--accent-2);
        font-weight: 600;
        position: relative;
      }
      .forgot-link::after {
        content: "";
        position: absolute;
        right: 0;
        left: 0;
        bottom: -2px;
        height: 1px;
        background: var(--accent-2);
        transform: scaleX(0);
        transform-origin: right;
        transition: transform 0.25s var(--ease);
      }
      .forgot-link:hover::after {
        transform: scaleX(1);
      }

      .divider-or {
        display: flex;
        align-items: center;
        gap: 0.9rem;
        margin: 1.4rem 0;
        opacity: 0;
        animation: fadeUp 0.7s var(--ease) 0.8s forwards;
      }
      .divider-or::before,
      .divider-or::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border);
      }
      .divider-or span {
        font-size: 0.78rem;
        color: var(--text-low);
      }

      .btn-google {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        width: 100%;
        height: 54px;
        border-radius: 14px;
        background: var(--glass);
        border: 1px solid var(--border);
        color: var(--text);
        font-family: inherit;
        font-size: 0.9rem;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.25s var(--ease);
        opacity: 0;
        animation: fadeUp 0.7s var(--ease) 0.9s forwards;
      }
      .btn-google:hover {
        background: var(--glass-strong);
        border-color: rgba(255, 255, 255, 0.28);
        transform: translateY(-2px);
        box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.5);
      }
      .btn-google:active {
        transform: translateY(0);
      }

      .btn-login {
        position: relative;
        width: 100%;
        height: 54px;
        border: 0;
        border-radius: 14px;
        background: linear-gradient(
          120deg,
          var(--accent) 0%,
          #0891b2 45%,
          #7c3aed 100%
        );
        background-size: 200% 200%;
        color: #fff;
        font-family: inherit;
        font-size: 0.95rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.55rem;
        overflow: hidden;
        cursor: pointer;
        box-shadow: 0 16px 36px -12px rgba(6, 182, 212, 0.55);
        transition:
          transform 0.25s var(--ease),
          box-shadow 0.25s var(--ease),
          background-position 0.6s var(--ease);
        opacity: 0;
        animation: fadeUp 0.7s var(--ease) 0.75s forwards;
      }
      .btn-login:hover {
        transform: translateY(-3px);
        box-shadow: 0 22px 46px -10px rgba(6, 182, 212, 0.7);
        background-position: 100% 50%;
      }
      .btn-login:active {
        transform: translateY(-1px) scale(0.99);
      }
      .btn-login:disabled {
        cursor: not-allowed;
        opacity: 0.85;
        transform: none;
      }
      .btn-login .ripple {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.55);
        transform: scale(0);
        animation: rippleAnim 0.65s var(--ease) forwards;
        pointer-events: none;
      }
      @keyframes rippleAnim {
        to {
          transform: scale(2.6);
          opacity: 0;
        }
      }
      .spinner {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 2.5px solid rgba(255, 255, 255, 0.35);
        border-top-color: #fff;
        animation: spin 0.7s linear infinite;
        display: none;
      }
      .btn-login.loading .spinner {
        display: inline-block;
      }
      .btn-login.loading .btn-label {
        display: none;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .btn-login.success {
        background: linear-gradient(120deg, var(--success), #16a34a);
        box-shadow: 0 16px 36px -12px rgba(34, 197, 94, 0.55);
      }

      .auth-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 1.6rem;
        padding-top: 1.2rem;
        border-top: 1px solid var(--border-soft, rgba(255, 255, 255, 0.08));
        opacity: 0;
        animation: fadeUp 0.7s var(--ease) 0.85s forwards;
      }
      .support-link {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.78rem;
        color: var(--text-mid);
      }
      .support-link:hover {
        color: var(--accent-2);
      }
      .support-link svg {
        width: 14px;
        height: 14px;
      }
      .version-tag {
        font-size: 0.7rem;
        color: var(--text-low);
        direction: ltr;
        font-variant-numeric: tabular-nums;
      }

      .mini-toast {
        position: fixed;
        bottom: 1.4rem;
        right: 50%;
        transform: translateX(50%) translateY(20px);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 0.85rem 1.3rem;
        display: flex;
        align-items: center;
        gap: 0.6rem;
        box-shadow: 0 20px 50px -20px rgba(0, 0, 0, 0.7);
        font-size: 0.84rem;
        font-weight: 600;
        opacity: 0;
        pointer-events: none;
        transition: all 0.4s var(--ease);
        z-index: 200;
      }
      .mini-toast.show {
        opacity: 1;
        transform: translateX(50%) translateY(0);
      }
      .mini-toast svg {
        width: 17px;
        height: 17px;
        color: var(--success);
        flex-shrink: 0;
      }
      .mini-toast.error svg {
        color: var(--danger);
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
      }
      @media (max-width: 520px) {
        .auth-card {
          padding: 2.1rem 1.5rem 1.7rem;
          border-radius: 22px;
        }
        .shape-a,
        .shape-b,
        .shape-c,
        .shape-d {
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body>
    <div class="auth-page">
      <div class="bg-fx" id="bgFx">
        <div class="grid-overlay"></div>
        <div class="blob blob-1" data-depth="18"></div>
        <div class="blob blob-2" data-depth="26"></div>
        <div class="blob blob-3" data-depth="12"></div>
        <canvas id="particleCanvas"></canvas>
        <div class="shape shape-a" data-depth="40"></div>
        <div class="shape shape-b" data-depth="55"></div>
        <div class="shape shape-c" data-depth="30"></div>
        <div class="shape shape-d" data-depth="48"></div>
        <div class="vignette"></div>
        <div class="noise-veil"></div>
      </div>

      <div class="auth-card" id="authCard">
        <div class="brand-area">
          <div class="brand-mark">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="#fff"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z" />
            </svg>
          </div>
          <div class="word">V O L T E X</div>
          <h1>پنل مدیریت فروش اسکوتر</h1>
          <p>برای ورود اطلاعات خود را وارد کنید</p>
        </div>

        <form id="loginForm" novalidate>
          <div class="field" id="userField">
            <div class="control">
              <span class="ic"><i class="bi bi-person"></i></span>
              <input
                type="text"
                id="username"
                placeholder=" "
                autocomplete="username"
              />
              <label for="username">نام کاربری یا شماره موبایل</label>
            </div>
            <p class="field-msg">
              لطفا نام کاربری یا شماره موبایل را وارد کنید
            </p>
          </div>

          <div class="field" id="passField">
            <div class="control">
              <span class="ic"><i class="bi bi-lock"></i></span>
              <input
                type="password"
                id="password"
                placeholder=" "
                autocomplete="current-password"
              />
              <label for="password">رمز عبور</label>
              <button
                type="button"
                class="toggle-pass"
                id="togglePass"
                aria-label="نمایش رمز عبور"
              >
                <i class="bi bi-eye"></i>
              </button>
            </div>
            <p class="field-msg">رمز عبور باید حداقل ۴ کاراکتر باشد</p>
          </div>

          <div class="row-between">
            <label class="chk-wrap">
              <input type="checkbox" id="rememberMe" />
              <span class="chk-box">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#fff"
                  stroke-width="3"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="m5 13 4 4L19 7" />
                </svg>
              </span>
              <span>مرا به خاطر بسپار</span>
            </label>

            <!-- لینک اصلاح شده با استفاده از name تعریف شده در urls.py -->
            <a
              href="{% url 'accounts_app:password_reset' %}"
              class="forgot-link"
              >فراموشی رمز عبور؟</a
            >
          </div>

          <button type="submit" class="btn-login" id="loginBtn">
            <span class="spinner"></span>
            <span class="btn-label" id="btnLabel">
              <i class="bi bi-box-arrow-in-left" style="margin-left: 0.4rem"></i
              >ورود به پنل
            </span>
          </button>
        </form>

        <div class="divider-or">
          <span>یا</span>
        </div>

        <a href="{% provider_login_url 'google' %}" class="btn-google">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path
              fill="#FFC107"
              d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.8-.4-3.5z"
            />
            <path
              fill="#FF3D00"
              d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3c-7.5 0-13.9 4.3-17.1 10.6z"
            />
            <path
              fill="#4CAF50"
              d="M24 45c5.5 0 10.5-2.1 14.3-5.5l-6.6-5.6C29.6 35.6 26.9 36.5 24 36.5c-5.3 0-9.7-3.4-11.3-8.1l-6.6 5.1C9.9 40.6 16.4 45 24 45z"
            />
            <path
              fill="#1976D2"
              d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4 5.5l6.6 5.6C41.9 35.6 44 29.8 44 24c0-1.4-.1-2.8-.4-3.5z"
            />
          </svg>
          <span>ورود با حساب گوگل</span>
        </a>

        <div class="auth-foot">
          <a href="#" class="support-link">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M4 4h16v12H7l-3 3V4Z" />
            </svg>
            پشتیبانی فنی
          </a>
          <span class="version-tag">v2.4.0</span>
        </div>
      </div>
    </div>

    <div class="mini-toast" id="miniToast">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.4"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="m5 13 4 4L19 7" />
      </svg>
      <span id="toastMsg">با موفقیت وارد شدید</span>
    </div>

    <script>
      (function () {
        var canvas = document.getElementById("particleCanvas");
        var ctx = canvas.getContext("2d");
        var particles = [];
        var W, H;
        var reduceMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;

        function resize() {
          W = canvas.width = canvas.offsetWidth;
          H = canvas.height = canvas.offsetHeight;
        }

        function initParticles() {
          var count = window.innerWidth < 600 ? 26 : 48;
          particles = [];
          for (var i = 0; i < count; i++) {
            particles.push({
              x: Math.random() * W,
              y: Math.random() * H,
              r: Math.random() * 1.8 + 0.6,
              vx: (Math.random() - 0.5) * 0.18,
              vy: (Math.random() - 0.5) * 0.18,
              a: Math.random() * 0.5 + 0.25,
              pulse: Math.random() * Math.PI * 2,
            });
          }
        }

        function drawParticles() {
          ctx.clearRect(0, 0, W, H);
          for (var i = 0; i < particles.length; i++) {
            var p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.pulse += 0.02;
            if (p.x < -10) p.x = W + 10;
            if (p.x > W + 10) p.x = -10;
            if (p.y < -10) p.y = H + 10;
            if (p.y > H + 10) p.y = -10;

            var alpha = p.a * (0.6 + 0.4 * Math.sin(p.pulse));
            ctx.beginPath();
            ctx.fillStyle = "rgba(103,232,249," + alpha + ")";
            ctx.shadowColor = "rgba(6,182,212,0.9)";
            ctx.shadowBlur = 6;
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
          }
          if (!reduceMotion) requestAnimationFrame(drawParticles);
        }

        window.addEventListener("resize", function () {
          resize();
          initParticles();
        });
        resize();
        initParticles();
        drawParticles();

        if (!reduceMotion && window.matchMedia("(pointer:fine)").matches) {
          var depthEls = document.querySelectorAll("[data-depth]");
          var card = document.getElementById("authCard");
          window.addEventListener("mousemove", function (e) {
            var mx = e.clientX / window.innerWidth - 0.5;
            var my = e.clientY / window.innerHeight - 0.5;
            depthEls.forEach(function (el) {
              var depth = parseFloat(el.getAttribute("data-depth"));
              el.style.transform = (el.style.transform || "").split(
                " translate3d",
              )[0];
              el.style.transform +=
                " translate3d(" + mx * depth + "px," + my * depth + "px,0)";
            });
            card.style.transform =
              "rotateY(" + mx * 4 + "deg) rotateX(" + -my * 4 + "deg)";
          });
          window.addEventListener("mouseleave", function () {
            card.style.transform = "rotateY(0deg) rotateX(0deg)";
          });
        }

        var pwd = document.getElementById("password");
        var toggleBtn = document.getElementById("togglePass");
        toggleBtn.addEventListener("click", function () {
          var isPass = pwd.type === "password";
          pwd.type = isPass ? "text" : "password";
          toggleBtn.innerHTML = isPass
            ? '<i class="bi bi-eye-slash"></i>'
            : '<i class="bi bi-eye"></i>';
        });

        var loginBtn = document.getElementById("loginBtn");
        loginBtn.addEventListener("click", function (e) {
          var rect = loginBtn.getBoundingClientRect();
          var size = Math.max(rect.width, rect.height);
          var ripple = document.createElement("span");
          ripple.className = "ripple";
          ripple.style.width = ripple.style.height = size + "px";
          ripple.style.left = e.clientX - rect.left - size / 2 + "px";
          ripple.style.top = e.clientY - rect.top - size / 2 + "px";
          loginBtn.appendChild(ripple);
          setTimeout(function () {
            ripple.remove();
          }, 650);
        });

        var userField = document.getElementById("userField");
        var passField = document.getElementById("passField");
        var userInput = document.getElementById("username");
        var passInput = document.getElementById("password");
        var form = document.getElementById("loginForm");
        var toast = document.getElementById("miniToast");
        var toastMsg = document.getElementById("toastMsg");

        function validateField(field, input, minLen) {
          var val = input.value.trim();
          if (val.length === 0 || val.length < minLen) {
            field.classList.add("is-invalid");
            field.classList.remove("is-valid");
            return false;
          }
          field.classList.remove("is-invalid");
          field.classList.add("is-valid");
          return true;
        }

        userInput.addEventListener("blur", function () {
          if (userInput.value.trim().length)
            validateField(userField, userInput, 3);
        });
        passInput.addEventListener("blur", function () {
          if (passInput.value.trim().length)
            validateField(passField, passInput, 4);
        });
        userInput.addEventListener("input", function () {
          userField.classList.remove("is-invalid");
        });
        passInput.addEventListener("input", function () {
          passField.classList.remove("is-invalid");
        });

        function showToast(msg, isError) {
          toastMsg.textContent = msg;
          toast.classList.toggle("error", !!isError);
          toast.classList.add("show");
          setTimeout(function () {
            toast.classList.remove("show");
          }, 3200);
        }

        function getCookie(name) {
          var match = document.cookie.match(
            "(^|;)\\s*" + name + "\\s*=\\s*([^;]+)",
          );
          return match ? match.pop() : "";
        }

        // سریالایزر لاگین فقط non_field_errors برمی‌گردونه (عمداً، برای جلوگیری از user enumeration)
        // پس ارور بک‌اند رو روی هر دو فیلد نشون می‌دیم + toast، نه فقط یکی
        function renderServerErrors(errors) {
          var messages = [];
          Object.keys(errors).forEach(function (key) {
            var val = errors[key];
            if (Array.isArray(val)) messages = messages.concat(val);
            else messages.push(String(val));
          });

          userField.classList.add("is-invalid");
          passField.classList.add("is-invalid");
          var msg = messages.join(" — ") || "ورود ناموفق بود";
          userField.querySelector(".field-msg").textContent = msg;
          passField.querySelector(".field-msg").textContent = msg;

          userInput.focus();
        }

        form.addEventListener("submit", function (e) {
          e.preventDefault();
          userField.classList.remove("is-invalid");
          passField.classList.remove("is-invalid");

          var validUser = validateField(userField, userInput, 3);
          var validPass = validateField(passField, passInput, 4);

          if (!validUser || !validPass) {
            if (!validUser) userInput.focus();
            else passInput.focus();
            return;
          }

          loginBtn.classList.add("loading");
          loginBtn.disabled = true;

          fetch("/accounts/api/login/", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-CSRFToken": getCookie("csrftoken"),
            },
            body: JSON.stringify({
              username: userInput.value.trim(),
              password: passInput.value,
            }),
          })
            .then(function (res) {
              return res.json().then(function (data) {
                return { status: res.status, data: data };
              });
            })
            .then(function (result) {
              loginBtn.classList.remove("loading");

              if (!result.data.success) {
                loginBtn.disabled = false;
                if (result.data.errors) renderServerErrors(result.data.errors);
                else showToast(result.data.message || "ورود ناموفق بود", true);
                return;
              }

              loginBtn.classList.add("success");
              document.getElementById("btnLabel").innerHTML =
                '<i class="bi bi-check-circle-fill" style="margin-left:.4rem;"></i>ورود موفق';
              document.getElementById("btnLabel").style.display = "flex";
              document.getElementById("btnLabel").style.alignItems = "center";
              document.getElementById("btnLabel").style.justifyContent =
                "center";
              showToast("خوش آمدید، در حال انتقال...");

              setTimeout(function () {
                window.location.href = "{% url 'home_app:index' %}"; // placeholder تا dashboard ساخته بشه
              }, 1200);
            })
            .catch(function () {
              loginBtn.classList.remove("loading");
              loginBtn.disabled = false;
              showToast("خطا در برقراری ارتباط با سرور", true);
            });
        });
      })();
    </script>
  </body>
</html>
