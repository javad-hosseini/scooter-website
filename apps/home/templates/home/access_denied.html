<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عدم دسترسی</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0f;
            font-family: 'Vazirmatn', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            direction: rtl;
            padding: 20px;
        }
        .card {
            background: #121218;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 20px;
            padding: 50px 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        .icon {
            font-size: 60px;
            margin-bottom: 20px;
            display: block;
        }
        h1 {
            color: #f6f6f8;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        p {
            color: rgba(246,246,248,0.6);
            font-size: 15px;
            line-height: 1.8;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            background: #4fd8ff;
            color: #050507;
            padding: 12px 32px;
            border-radius: 100px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }
        .btn:hover {
            background: #8b7bff;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: transparent;
            color: rgba(246,246,248,0.6);
            border: 1px solid rgba(255,255,255,0.1);
            margin-right: 10px;
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.05);
            color: #fff;
        }
        .code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: rgba(246,246,248,0.2);
            margin-top: 20px;
            display: block;
            direction: ltr;
        }
    </style>
</head>
<body>

    <div class="card">
        <span class="icon">🔒</span>
        <h1>دسترسی غیرمجاز</h1>
        <p>
            شما اجازه دسترسی به این صفحه را ندارید.<br>
            این بخش فقط برای مدیران سیستم قابل دسترسی است.
        </p>
        <div>
            <a href="/" class="btn">بازگشت به صفحه اصلی</a>
            <a href="/accounts/login/" class="btn btn-secondary">ورود به حساب</a>
        </div>
        <span class="code">403 — Forbidden</span>
    </div>

</body>
</html>
